<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a237e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Stock Alarm</title>
<style>
:root{--bg:#0f1117;--card:#1a1d2e;--card2:#252840;--accent:#4fc3f7;--green:#4caf50;--red:#ef5350;--gold:#ffd740;--text:#e8eaed;--dim:#9aa0a6;--blue:#1a237e;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:80px}
.header{background:linear-gradient(135deg,#1a237e,#283593);padding:20px 16px 16px;padding-top:max(20px,env(safe-area-inset-top));position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:700;letter-spacing:.5px}
.header .date{font-size:12px;color:#90caf9;margin-top:2px}
.tabs{display:flex;background:var(--card);border-bottom:1px solid #333;position:sticky;top:0;z-index:99}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.tab.active{color:var(--accent);border-color:var(--accent)}
.tab-content{display:none}.tab-content.active{display:block}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.summary-card{background:var(--card);border-radius:var(--radius);padding:14px}
.summary-card .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.summary-card .value{font-size:20px;font-weight:700;margin-top:4px}
.summary-card.full{grid-column:1/-1}
.up{color:var(--green)}.down{color:var(--red)}
.stock-card{background:var(--card);border-radius:var(--radius);margin:8px 16px;overflow:hidden;transition:transform .2s}
.stock-card:active{transform:scale(.98)}
.stock-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer}
.stock-header .left h3{font-size:16px;font-weight:700}.stock-header .left .name{font-size:11px;color:var(--dim)}
.stock-header .right{text-align:right}
.stock-header .price{font-size:16px;font-weight:600}
.stock-header .change{font-size:12px;font-weight:600}
.signal-badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.5px}
.signal-STRONG-BUY{background:#1b5e20;color:#a5d6a7}.signal-BUY{background:#2e7d32;color:#c8e6c9}
.signal-HOLD{background:#f57f17;color:#fff9c4}.signal-SELL{background:#c62828;color:#ffcdd2}.signal-STRONG-SELL{background:#b71c1c;color:#ffcdd2}
.stock-detail{display:none;padding:0 16px 16px;animation:slideDown .2s ease}
.stock-detail.open{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--card2);border-radius:10px;padding:10px 12px}
.metric .label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
.metric .val{font-size:14px;font-weight:600;margin-top:2px}
.section-title{font-size:13px;font-weight:700;color:var(--accent);padding:14px 16px 6px;text-transform:uppercase;letter-spacing:.5px}
.analyst-bar{display:flex;height:24px;border-radius:6px;overflow:hidden;margin:8px 0}
.analyst-bar div{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.analyst-bar .sb{background:#1b5e20}.analyst-bar .b{background:#43a047}.analyst-bar .h{background:#f9a825}.analyst-bar .s{background:#e53935}.analyst-bar .ss{background:#b71c1c}
.zacks-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px}
.zacks-1{background:#1b5e20;color:#c8e6c9}.zacks-2{background:#2e7d32;color:#c8e6c9}.zacks-3{background:#f57f17;color:#fff9c4}.zacks-4{background:#c62828;color:#ffcdd2}.zacks-5{background:#b71c1c;color:#ffcdd2}
.news-item{padding:10px 0;border-bottom:1px solid #333}
.news-item:last-child{border:none}
.news-item a{color:var(--accent);text-decoration:none;font-size:13px;line-height:1.4}
.news-item .source{font-size:11px;color:var(--dim);margin-top:2px}
.reasons-list{list-style:none;padding:8px 0}
.reasons-list li{padding:4px 0;font-size:12px;color:var(--dim)}
.reasons-list li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px}
.reasons-list li.bullish::before{background:var(--green)}.reasons-list li.bearish::before{background:var(--red)}.reasons-list li.neutral::before{background:var(--gold)}
.discovery-card{background:var(--card);border-radius:var(--radius);margin:8px 16px;overflow:hidden}
.discovery-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer}
.discovery-header .sym{font-size:15px;font-weight:700}.discovery-header .nm{font-size:11px;color:var(--dim)}
.discovery-detail{display:none;padding:0 16px 16px}.discovery-detail.open{display:block}
.analysis-text{font-size:12px;line-height:1.6;color:var(--dim);padding:8px 0;border-bottom:1px solid #333;margin-bottom:8px}
.chart-container{background:var(--card);border-radius:var(--radius);margin:8px 16px;padding:16px}
.chart-container canvas{width:100%;height:200px}
.holdings-bar{display:flex;height:28px;border-radius:6px;overflow:hidden;margin:6px 0}
.holdings-bar div{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;padding:0 2px}
.holdings-legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.holdings-legend span{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:4px}
.holdings-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sector-bars{margin:6px 0}
.sector-row{display:flex;align-items:center;margin:3px 0;font-size:11px}
.sector-row .lbl{width:110px;color:var(--dim);text-transform:capitalize;flex-shrink:0}
.sector-row .bar-bg{flex:1;height:14px;background:var(--card2);border-radius:4px;overflow:hidden}
.sector-row .bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;font-size:9px;font-weight:600;color:#fff;min-width:20px}
.returns-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.returns-grid .ret{background:var(--card2);border-radius:8px;padding:8px;text-align:center}
.returns-grid .ret .period{font-size:9px;color:var(--dim);text-transform:uppercase}
.returns-grid .ret .pct{font-size:14px;font-weight:700;margin-top:2px}
.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.risk-grid .rk{background:var(--card2);border-radius:8px;padding:8px;text-align:center}
.risk-grid .rk .rlbl{font-size:9px;color:var(--dim);text-transform:uppercase}
.risk-grid .rk .rval{font-size:14px;font-weight:700;margin-top:2px;color:var(--accent)}
.glossary-item{padding:12px 16px;border-bottom:1px solid #222}
.glossary-item dt{font-size:13px;font-weight:700;color:var(--accent)}
.glossary-item dd{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5}
.pull-refresh{text-align:center;padding:12px;font-size:12px;color:var(--dim)}
.loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:14px;color:var(--dim)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid #333;display:flex;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:100}
.nav-item{flex:1;padding:10px 8px 6px;text-align:center;font-size:10px;color:var(--dim);cursor:pointer}
.nav-item.active{color:var(--accent)}
.nav-item .icon{font-size:20px;margin-bottom:2px}
.earnings-tag{display:inline-block;background:#4a148c;color:#ce93d8;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin-top:4px}
.paper-chart{background:var(--card);border-radius:var(--radius);margin:8px 16px;padding:16px;position:relative}
.paper-chart canvas{width:100%;height:180px}
.paper-chart svg{width:100%;height:180px}
.trade-row{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid #222;gap:10px}
.trade-row .trade-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.trade-row .trade-icon.buy{background:#1b5e20;color:#a5d6a7}.trade-row .trade-icon.sell{background:#b71c1c;color:#ffcdd2}
.trade-row .trade-info{flex:1;min-width:0}
.trade-row .trade-info .sym{font-size:14px;font-weight:700}
.trade-row .trade-info .detail{font-size:11px;color:var(--dim)}
.trade-row .trade-val{text-align:right;flex-shrink:0}
.trade-row .trade-val .amt{font-size:14px;font-weight:600}
.trade-row .trade-val .pnl{font-size:11px}
.paper-pos{background:var(--card);border-radius:var(--radius);margin:8px 16px;padding:12px 16px}
.paper-pos .pos-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #222}
.paper-pos .pos-row:last-child{border:none}
.paper-pos .pos-sym{font-weight:700;font-size:14px}
.paper-pos .pos-type{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;text-transform:uppercase}
.paper-pos .pos-type.stock{background:#1a237e;color:#90caf9}.paper-pos .pos-type.etf{background:#4a148c;color:#ce93d8}
.paper-pos .pos-detail{font-size:11px;color:var(--dim)}
.paper-pos .pos-val{text-align:right}
.paper-pos .pos-val .price{font-size:13px;font-weight:600}
.paper-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 16px}
</style>
</head>
<body>

<div class="header">
  <h1>STOCK ALARM</h1>
  <div class="date" id="reportDate">Loading...</div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="switchPage('portfolio')"><div class="icon">&#128188;</div>Portfolio</div>
  <div class="nav-item" onclick="switchPage('discover')"><div class="icon">&#128270;</div>Discover</div>
  <div class="nav-item" onclick="switchPage('paper')"><div class="icon">&#128200;</div>Paper</div>
  <div class="nav-item" onclick="switchPage('glossary')"><div class="icon">&#128218;</div>Glossary</div>
</div>

<div id="page-portfolio" class="page active">
  <div id="summaryArea"></div>
  <div class="section-title">Your Holdings</div>
  <div id="stocksArea"></div>
</div>

<div id="page-discover" class="page" style="display:none">
  <div class="tabs">
    <div class="tab active" onclick="switchDiscoverTab('stocks')">Stocks</div>
    <div class="tab" onclick="switchDiscoverTab('etfs')">ETFs</div>
  </div>
  <div id="discover-stocks" class="tab-content active"></div>
  <div id="discover-etfs" class="tab-content"></div>
</div>

<div id="page-paper" class="page" style="display:none">
  <div id="paperSummary"></div>
  <div id="paperChart"></div>
  <div id="paperPositions"></div>
  <div id="paperTrades"></div>
</div>

<div id="page-glossary" class="page" style="display:none">
  <div class="section-title">Financial Glossary</div>
  <div id="glossaryArea"></div>
</div>

<script>
const fmt$ = n => n==null||n===0?'N/A':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = n => n==null?'N/A':(n>=0?'+':'')+n.toFixed(2)+'%';
const fmtCap = n => {if(!n)return'N/A';if(n>=1e12)return'$'+(n/1e12).toFixed(2)+'T';if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(0)+'M';return'$'+n.toLocaleString()};
const fmtCF = n => {if(!n)return'N/A';if(Math.abs(n)>=1e9)return'$'+(n/1e9).toFixed(1)+'B';if(Math.abs(n)>=1e6)return'$'+(n/1e6).toFixed(0)+'M';return'$'+n.toLocaleString()};
const pc = v => v>=0?'up':'down';

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.getElementById('page-'+name).style.display='block';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

function switchDiscoverTab(tab) {
  document.querySelectorAll('#page-discover .tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('#page-discover .tab-content').forEach(t=>t.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('discover-'+tab).classList.add('active');
}

function toggleDetail(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

function analystBar(a) {
  const t = a.total||1;
  return `<div class="analyst-bar">
    ${a.strongBuy?`<div class="sb" style="width:${a.strongBuy/t*100}%">${a.strongBuy}</div>`:''}
    ${a.buy?`<div class="b" style="width:${a.buy/t*100}%">${a.buy}</div>`:''}
    ${a.hold?`<div class="h" style="width:${a.hold/t*100}%">${a.hold}</div>`:''}
    ${a.sell?`<div class="s" style="width:${a.sell/t*100}%">${a.sell}</div>`:''}
    ${a.strongSell?`<div class="ss" style="width:${a.strongSell/t*100}%">${a.strongSell}</div>`:''}
  </div>`;
}

function renderPortfolio(data) {
  document.getElementById('reportDate').textContent = data.dateStr;
  
  document.getElementById('summaryArea').innerHTML = `
    <div class="summary-grid">
      <div class="summary-card"><div class="label">Invested</div><div class="value">${fmt$(data.totalInvested)}</div></div>
      <div class="summary-card"><div class="label">Current</div><div class="value">${fmt$(data.totalCurrentValue)}</div></div>
      <div class="summary-card"><div class="label">P&L</div><div class="value ${pc(data.totalPnL)}">${fmt$(data.totalPnL)}</div></div>
      <div class="summary-card"><div class="label">Return</div><div class="value ${pc(data.totalPnLPct)}">${fmtPct(data.totalPnLPct)}</div></div>
    </div>`;

  document.getElementById('stocksArea').innerHTML = data.stocks.filter(s=>!s.error).map((s,i) => `
    <div class="stock-card">
      <div class="stock-header" onclick="toggleDetail('sd${i}')">
        <div class="left">
          <h3>${s.ticker} <span class="signal-badge signal-${s.signal.replace(/\s/g,'-')}">${s.signal}</span></h3>
          <div class="name">${s.name}</div>
        </div>
        <div class="right">
          <div class="price">${fmt$(s.price)}</div>
          <div class="change ${pc(s.dayChangePct)}">${fmtPct(s.dayChangePct)}</div>
        </div>
      </div>
      <div class="stock-detail" id="sd${i}">
        <div class="metrics-grid">
          <div class="metric"><div class="label">Your Cost</div><div class="val">${fmt$(s.avgCost)} x ${s.quantity}</div></div>
          <div class="metric"><div class="label">Value</div><div class="val">${fmt$(s.value)}</div></div>
          <div class="metric"><div class="label">P&L</div><div class="val ${pc(s.pnl)}">${fmt$(s.pnl)}</div></div>
          <div class="metric"><div class="label">Total Return</div><div class="val ${pc(s.pnlPct)}">${fmtPct(s.pnlPct)}</div></div>
          <div class="metric"><div class="label">52wk Range</div><div class="val">${fmt$(s.fiftyTwoWeekLow)} - ${fmt$(s.fiftyTwoWeekHigh)}</div></div>
          <div class="metric"><div class="label">52wk Change</div><div class="val ${pc(s.fiftyTwoWeekChangePct)}">${fmtPct(s.fiftyTwoWeekChangePct)}</div></div>
          <div class="metric"><div class="label">50d / 200d Avg</div><div class="val">${fmt$(s.fiftyDayAvg)} / ${fmt$(s.twoHundredDayAvg)}</div></div>
          <div class="metric"><div class="label">Market Cap</div><div class="val">${fmtCap(s.marketCap)}</div></div>
          <div class="metric"><div class="label">P/E (TTM)</div><div class="val">${s.pe?s.pe.toFixed(1):'N/A'}</div></div>
          <div class="metric"><div class="label">Forward P/E</div><div class="val">${s.forwardPE?s.forwardPE.toFixed(1):'N/A'}</div></div>
        </div>
        ${s.zacks?`<div style="margin-top:10px"><span class="zacks-badge zacks-${s.zacks.rank}">Zacks #${s.zacks.rank} ${s.zacks.label}</span></div>`:''}
        ${s.analysts.total?`<div class="section-title" style="padding-left:0">Analyst Ratings (${s.analysts.total})</div>${analystBar(s.analysts)}<div class="metrics-grid"><div class="metric"><div class="label">Target Low</div><div class="val">${fmt$(s.analysts.targetLow)}</div></div><div class="metric"><div class="label">Target Mean</div><div class="val" style="color:var(--accent)">${fmt$(s.analysts.targetMean)}</div></div><div class="metric"><div class="label">Target High</div><div class="val">${fmt$(s.analysts.targetHigh)}</div></div><div class="metric"><div class="label">Upside</div><div class="val ${pc(s.analysts.targetMean-s.price)}">${fmtPct(((s.analysts.targetMean-s.price)/s.price)*100)}</div></div></div>`:''}
        <div class="section-title" style="padding-left:0">Signal Breakdown (Score: ${s.signalScore.toFixed(0)})</div>
        <ul class="reasons-list">${s.reasons.map(r=>`<li class="${r.includes('buy')||r.includes('Positive')||r.includes('Above')?'bullish':r.includes('sell')||r.includes('Negative')||r.includes('Below')||r.includes('loss')?'bearish':'neutral'}">${r.replace(/[\uD83D\uDD34\uD83D\uDFE2\u26AA\uFE0F]/gu,'')}</li>`).join('')}</ul>
        <div class="section-title" style="padding-left:0">Sentiment: ${s.sentiment}</div>
        ${s.news.length?`<div class="section-title" style="padding-left:0">Latest News</div>${s.news.map(n=>`<div class="news-item"><a href="${n.link}" target="_blank">${n.title}</a><div class="source">${n.source}</div></div>`).join('')}`:''}
      </div>
    </div>`).join('');
}

function renderDiscovery(data) {
  // Stocks
  document.getElementById('discover-stocks').innerHTML = data.stocks.length
    ? `<div class="section-title">${data.stocks.length} Strong Buy Picks</div>` + data.stocks.map((s,i) => `
    <div class="discovery-card">
      <div class="discovery-header" onclick="toggleDetail('ds${i}')">
        <div><span class="sym">${s.symbol}</span> <span class="nm">${s.name}</span>
          ${s.zacks?`<span class="signal-badge signal-${s.zacks.rank<=1?'STRONG-BUY':'BUY'}">${s.zacks.label}</span>`:''}</div>
        <div style="text-align:right"><div style="font-weight:700">${fmt$(s.price)}</div><div class="change ${pc(s.dayChangePct)}" style="font-size:12px">${fmtPct(s.dayChangePct)}</div></div>
      </div>
      <div class="discovery-detail" id="ds${i}">
        <div class="analysis-text">${s.analysis||''}</div>
        <div class="metrics-grid">
          <div class="metric"><div class="label">Sector</div><div class="val">${s.sector||'N/A'}</div></div>
          <div class="metric"><div class="label">Industry</div><div class="val">${s.industry||'N/A'}</div></div>
          <div class="metric"><div class="label">Market Cap</div><div class="val">${fmtCap(s.marketCap)}</div></div>
          <div class="metric"><div class="label">P/E</div><div class="val">${s.pe?s.pe.toFixed(1):'N/A'}</div></div>
          <div class="metric"><div class="label">EPS</div><div class="val">${s.eps?'$'+s.eps.toFixed(2):'N/A'}</div></div>
          <div class="metric"><div class="label">Forward EPS</div><div class="val">${s.forwardEps?'$'+s.forwardEps.toFixed(2):'N/A'}</div></div>
          <div class="metric"><div class="label">PEG Ratio</div><div class="val">${s.pegRatio?s.pegRatio.toFixed(2):'N/A'}</div></div>
          <div class="metric"><div class="label">Beta</div><div class="val">${s.beta?s.beta.toFixed(2):'N/A'}</div></div>
          <div class="metric"><div class="label">P/B</div><div class="val">${s.priceToBook?s.priceToBook.toFixed(2):'N/A'}</div></div>
          <div class="metric"><div class="label">Div Yield</div><div class="val">${s.dividendYield?fmtPct(s.dividendYield*100):'N/A'}</div></div>
          <div class="metric"><div class="label">Revenue Growth</div><div class="val ${pc(s.revenueGrowth)}">${s.revenueGrowth?fmtPct(s.revenueGrowth*100):'N/A'}</div></div>
          <div class="metric"><div class="label">Earnings Growth</div><div class="val ${pc(s.earningsGrowth)}">${s.earningsGrowth?fmtPct(s.earningsGrowth*100):'N/A'}</div></div>
          <div class="metric"><div class="label">Profit Margin</div><div class="val">${s.profitMargins?fmtPct(s.profitMargins*100):'N/A'}</div></div>
          <div class="metric"><div class="label">Gross Margin</div><div class="val">${s.grossMargins?fmtPct(s.grossMargins*100):'N/A'}</div></div>
          <div class="metric"><div class="label">Op Margin</div><div class="val">${s.operatingMargins?fmtPct(s.operatingMargins*100):'N/A'}</div></div>
          <div class="metric"><div class="label">ROE</div><div class="val">${s.returnOnEquity?fmtPct(s.returnOnEquity*100):'N/A'}</div></div>
          <div class="metric"><div class="label">D/E Ratio</div><div class="val">${s.debtToEquity?s.debtToEquity.toFixed(1):'N/A'}</div></div>
          <div class="metric"><div class="label">Free Cash Flow</div><div class="val">${fmtCF(s.freeCashflow)}</div></div>
          <div class="metric"><div class="label">Revenue</div><div class="val">${fmtCF(s.totalRevenue)}</div></div>
          <div class="metric"><div class="label">EBITDA</div><div class="val">${fmtCF(s.ebitda)}</div></div>
        </div>
        ${s.earningsDate?`<div class="earnings-tag">Earnings: ${new Date(s.earningsDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>`:''}
        ${s.strongBuy!=null?`<div class="section-title" style="padding-left:0">Analyst Ratings</div>${analystBar({strongBuy:s.strongBuy,buy:s.buy,hold:s.hold,sell:s.sell,strongSell:s.strongSell,total:(s.strongBuy||0)+(s.buy||0)+(s.hold||0)+(s.sell||0)+(s.strongSell||0)})}<div class="metrics-grid"><div class="metric"><div class="label">Target</div><div class="val">${fmt$(s.targetLow)} - ${fmt$(s.targetHigh)}</div></div><div class="metric"><div class="label">Mean Target</div><div class="val" style="color:var(--accent)">${fmt$(s.targetMean)}</div></div></div>`:''}
        ${s.zacks?`<div style="margin-top:10px"><span class="zacks-badge zacks-${s.zacks.rank}">Zacks #${s.zacks.rank} ${s.zacks.label}</span></div>`:''}
      </div>
    </div>`).join('')
    : '<div class="loading">No stock picks today</div>';

  // ETFs
  const hColors = ['#4fc3f7','#4caf50','#ffd740','#ff7043','#ab47bc','#26a69a','#ef5350','#78909c','#7e57c2','#ec407a'];

  document.getElementById('discover-etfs').innerHTML = data.etfs.length
    ? `<div class="section-title">${data.etfs.length} Top ETF Picks</div>` + data.etfs.map((e,i) => {
      // Holdings distribution bar
      const holdingsHtml = e.holdings?.length ? `
        <div class="section-title" style="padding-left:0">Holdings Distribution</div>
        <div class="holdings-bar">${e.holdings.map((h,j)=>`<div style="width:${(h.pct*100).toFixed(1)}%;background:${hColors[j%hColors.length]}" title="${h.name}: ${(h.pct*100).toFixed(1)}%">${h.pct>0.04?h.symbol:''}</div>`).join('')}</div>
        <div class="holdings-legend">${e.holdings.map((h,j)=>`<span><span class="dot" style="background:${hColors[j%hColors.length]}"></span>${h.symbol||h.name} ${(h.pct*100).toFixed(1)}%</span>`).join('')}</div>` : '';

      // Sector weightings
      const sectorHtml = e.sectorWeightings?.length ? `
        <div class="section-title" style="padding-left:0">Sector Allocation</div>
        <div class="sector-bars">${e.sectorWeightings.map(s=>`<div class="sector-row"><span class="lbl">${s.sector}</span><div class="bar-bg"><div class="bar-fill" style="width:${(s.pct*100).toFixed(0)}%;background:${s.pct>0.2?'var(--accent)':s.pct>0.1?'#4caf50':'#78909c'}">${(s.pct*100).toFixed(1)}%</div></div></div>`).join('')}</div>` : '';

      // Trailing returns
      const ret = e.returns||{};
      const hasReturns = ret.ytd!=null||ret.oneMonth!=null;
      const returnsHtml = hasReturns ? `
        <div class="section-title" style="padding-left:0">Trailing Returns</div>
        <div class="returns-grid">
          ${ret.oneMonth!=null?`<div class="ret"><div class="period">1 Month</div><div class="pct ${pc(ret.oneMonth)}">${fmtPct(ret.oneMonth*100)}</div></div>`:''}
          ${ret.threeMonth!=null?`<div class="ret"><div class="period">3 Month</div><div class="pct ${pc(ret.threeMonth)}">${fmtPct(ret.threeMonth*100)}</div></div>`:''}
          ${ret.ytd!=null?`<div class="ret"><div class="period">YTD</div><div class="pct ${pc(ret.ytd)}">${fmtPct(ret.ytd*100)}</div></div>`:''}
          ${ret.oneYear!=null?`<div class="ret"><div class="period">1 Year</div><div class="pct ${pc(ret.oneYear)}">${fmtPct(ret.oneYear*100)}</div></div>`:''}
          ${ret.threeYear!=null?`<div class="ret"><div class="period">3 Year</div><div class="pct ${pc(ret.threeYear)}">${fmtPct(ret.threeYear*100)}</div></div>`:''}
          ${ret.fiveYear!=null?`<div class="ret"><div class="period">5 Year</div><div class="pct ${pc(ret.fiveYear)}">${fmtPct(ret.fiveYear*100)}</div></div>`:''}
        </div>` : '';

      // Risk metrics
      const rk = e.risk||{};
      const hasRisk = rk.sharpe!=null||rk.alpha!=null;
      const riskHtml = hasRisk ? `
        <div class="section-title" style="padding-left:0">Risk Analysis (3Y)</div>
        <div class="risk-grid">
          ${rk.sharpe!=null?`<div class="rk"><div class="rlbl">Sharpe</div><div class="rval">${rk.sharpe.toFixed(2)}</div></div>`:''}
          ${rk.alpha!=null?`<div class="rk"><div class="rlbl">Alpha</div><div class="rval">${rk.alpha.toFixed(2)}</div></div>`:''}
          ${rk.beta!=null?`<div class="rk"><div class="rlbl">Beta</div><div class="rval">${rk.beta.toFixed(2)}</div></div>`:''}
          ${rk.stdDev!=null?`<div class="rk"><div class="rlbl">Std Dev</div><div class="rval">${rk.stdDev.toFixed(1)}%</div></div>`:''}
          ${rk.rSquared!=null?`<div class="rk"><div class="rlbl">R-Squared</div><div class="rval">${rk.rSquared.toFixed(1)}</div></div>`:''}
          ${rk.treynor!=null?`<div class="rk"><div class="rlbl">Treynor</div><div class="rval">${rk.treynor.toFixed(2)}</div></div>`:''}
        </div>` : '';

      // Zacks badge
      const zacksHtml = e.zacks ? `<div style="margin-top:10px"><span class="zacks-badge zacks-${e.zacks.rank}">Zacks #${e.zacks.rank} ${e.zacks.label}</span></div>` : '';

      return `
    <div class="discovery-card">
      <div class="discovery-header" onclick="toggleDetail('de${i}')">
        <div><span class="sym">${e.symbol}</span> <span class="nm">${e.name}</span>
          ${e.zacks?`<span class="signal-badge signal-${e.zacks.rank<=1?'STRONG-BUY':'BUY'}">${e.zacks.label}</span>`:''}</div>
        <div style="text-align:right"><div style="font-weight:700">${fmt$(e.price)}</div><div class="${pc(e.dayChangePct)}" style="font-size:12px">${fmtPct(e.dayChangePct)}</div></div>
      </div>
      <div class="discovery-detail" id="de${i}">
        <div class="analysis-text">${e.analysis||''}</div>
        <div class="metrics-grid">
          <div class="metric"><div class="label">Category</div><div class="val">${e.category||'N/A'}</div></div>
          <div class="metric"><div class="label">Fund Family</div><div class="val">${e.fundFamily||'N/A'}</div></div>
          <div class="metric"><div class="label">52wk Return</div><div class="val ${pc(e.fiftyTwoWeekChangePct)}">${fmtPct(e.fiftyTwoWeekChangePct)}</div></div>
          <div class="metric"><div class="label">Expense Ratio</div><div class="val">${e.expenseRatio?(e.expenseRatio*100).toFixed(2)+'%':'N/A'}</div></div>
          <div class="metric"><div class="label">Yield</div><div class="val">${e.yield?(e.yield*100).toFixed(2)+'%':'N/A'}</div></div>
          <div class="metric"><div class="label">AUM</div><div class="val">${fmtCap(e.totalAssets)}</div></div>
          <div class="metric"><div class="label">Beta</div><div class="val">${e.beta?e.beta.toFixed(2):'N/A'}</div></div>
          <div class="metric"><div class="label">Type</div><div class="val">${e.legalType||'ETF'}</div></div>
        </div>
        ${holdingsHtml}
        ${sectorHtml}
        ${returnsHtml}
        ${riskHtml}
        ${zacksHtml}
      </div>
    </div>`;}).join('')
    : '<div class="loading">No ETF picks today</div>';
}

function renderGlossary() {
  const terms = [
    ['P/E Ratio (Price-to-Earnings)','The stock price divided by earnings per share. Shows how much investors pay per dollar of earnings. Lower P/E may indicate undervaluation; higher P/E suggests growth expectations.'],
    ['Forward P/E','P/E ratio using estimated future earnings instead of trailing 12-month earnings. Useful for comparing current price against expected profitability.'],
    ['EPS (Earnings Per Share)','Company\'s net profit divided by outstanding shares. Higher EPS means more profit per share. Compare EPS growth quarter-over-quarter and year-over-year.'],
    ['PEG Ratio','P/E ratio divided by earnings growth rate. PEG < 1 suggests undervaluation relative to growth; PEG > 2 may indicate overvaluation.'],
    ['Market Cap','Total market value of a company\'s outstanding shares (price x shares). Large Cap: >$10B, Mid Cap: $2-10B, Small Cap: <$2B.'],
    ['Beta','Measures stock volatility relative to the market. Beta 1.0 = moves with market. Beta > 1 = more volatile. Beta < 1 = less volatile.'],
    ['P/B Ratio (Price-to-Book)','Stock price divided by book value per share. P/B < 1 may indicate undervaluation. Common for comparing financial sector stocks.'],
    ['Dividend Yield','Annual dividend payment divided by stock price, expressed as percentage. Higher yield = more income, but very high yields may signal risk.'],
    ['ROE (Return on Equity)','Net income divided by shareholder equity. Shows how efficiently a company uses equity to generate profits. Higher ROE (>15%) is generally better.'],
    ['Debt-to-Equity (D/E)','Total debt divided by shareholder equity. Higher D/E means more leverage/risk. Varies by industry — utilities often have high D/E; tech companies lower.'],
    ['Revenue Growth','Year-over-year percentage increase in total revenue. Consistent growth suggests a healthy, expanding business.'],
    ['Earnings Growth','Year-over-year percentage change in net earnings. Positive growth drives stock price appreciation.'],
    ['Profit Margin','Net income as a percentage of revenue. Shows how much of each dollar of revenue becomes profit. Higher margins = more efficient.'],
    ['Gross Margin','Revenue minus cost of goods sold, divided by revenue. Shows the markup on products/services before operating expenses.'],
    ['Operating Margin','Operating income divided by revenue. Shows profitability from core business operations, excluding taxes and interest.'],
    ['Free Cash Flow (FCF)','Cash generated after capital expenditures. Positive FCF means the company can fund dividends, buybacks, debt repayment, or growth.'],
    ['EBITDA','Earnings Before Interest, Taxes, Depreciation, and Amortization. Used to compare profitability across companies regardless of capital structure.'],
    ['50-Day Moving Average','Average closing price over the last 50 trading days. Price above 50-day MA is considered bullish; below is bearish.'],
    ['200-Day Moving Average','Average closing price over the last 200 trading days. A long-term trend indicator. Golden Cross (50d crosses above 200d) = bullish signal.'],
    ['52-Week Range','The lowest and highest prices a stock has traded at in the past year. Helps gauge where the current price sits relative to recent history.'],
    ['Analyst Target Price','The average stock price that Wall Street analysts predict. "Upside" is how much higher the target is vs. current price.'],
    ['Zacks Rank','Proprietary stock rating system by Zacks Investment Research. #1 Strong Buy to #5 Strong Sell. Based on earnings estimate revisions — historically, #1 stocks have outperformed.'],
    ['Expense Ratio (ETF)','Annual fee charged by an ETF, expressed as a percentage of assets. Lower is better. Index ETFs: 0.03-0.20%. Actively managed: 0.50-1.00%+.'],
    ['AUM (Assets Under Management)','Total market value of assets in an ETF. Higher AUM usually means better liquidity and tighter bid-ask spreads.'],
    ['Yield (ETF)','Annual dividend/interest income distributed by the ETF, as a percentage of its price.'],
    ['Sentiment Analysis','Automated analysis of news headlines to gauge market mood. Positive/Negative/Neutral based on keyword frequency in recent articles.'],
    ['Signal Score','Our composite score (0-100) combining Analyst Consensus (25%), Zacks Rank (20%), Price Target (20%), Moving Averages (15%), News Sentiment (10%), and P&L Position (10%).'],
    ['Sharpe Ratio','Risk-adjusted return metric. Calculated as (return - risk-free rate) / standard deviation. Higher is better. Above 1.0 = good, above 2.0 = excellent. Helps compare ETFs with different risk levels.'],
    ['Alpha','Excess return of an ETF relative to its benchmark. Positive alpha means outperformance. Alpha of 2.0 means the fund returned 2% more than expected given its risk.'],
    ['R-Squared','How closely an ETF tracks its benchmark index, from 0-100. R² of 95+ means the ETF closely mirrors the index. Lower R² = more independent movement.'],
    ['Standard Deviation','Measures the volatility of returns. Higher std dev = more price swings. A fund with 20% std dev has bigger ups and downs than one with 10%.'],
    ['Treynor Ratio','Risk-adjusted return per unit of systematic risk (beta). Similar to Sharpe but uses beta instead of total volatility. Higher is better.'],
    ['Sector Allocation','How an ETF distributes investments across economic sectors (Technology, Healthcare, etc.). Shows concentration risk — heavy weighting in one sector means more exposure to that sector\'s performance.'],
    ['Holdings Distribution','Percentage breakdown of the ETF\'s top individual stock holdings. Top-heavy ETFs (large % in few stocks) carry more concentration risk.'],
    ['Trailing Returns','Historical returns over various periods (1-month, YTD, 1-year, 3-year, 5-year). Past performance doesn\'t guarantee future results, but shows consistency.'],
    ['Fund Family','The investment company that manages the ETF (e.g., Vanguard, BlackRock/iShares, Invesco). Different families have different fee structures and investment philosophies.'],
  ];
  document.getElementById('glossaryArea').innerHTML = terms.map(([dt,dd])=>`<div class="glossary-item"><dt>${dt}</dt><dd>${dd}</dd></div>`).join('');
}

function renderPaperTrading(data) {
  if (!data || !data.history) {
    document.getElementById('paperSummary').innerHTML = '<div class="loading">Paper trading not started yet. Run the stock alarm first.</div>';
    return;
  }

  const totalValue = data.cash + data.positions.reduce((s,p)=>s+p.shares*(p.currentPrice||p.avgCost),0);
  const totalReturn = ((totalValue - data.startingCapital) / data.startingCapital) * 100;
  const posValue = data.positions.reduce((s,p)=>s+p.shares*(p.currentPrice||p.avgCost),0);

  // Stats
  const allSells = data.trades.filter(t=>t.action==='SELL'&&t.realizedPnL!=null);
  const totalRealized = allSells.reduce((s,t)=>s+(t.realizedPnL||0),0);
  const bestTrade = allSells.length ? allSells.reduce((a,b)=>(b.realizedPnL||0)>(a.realizedPnL||0)?b:a) : null;
  const worstTrade = allSells.length ? allSells.reduce((a,b)=>(b.realizedPnL||0)<(a.realizedPnL||0)?b:a) : null;
  const daysSinceStart = data.history.length || 1;

  document.getElementById('paperSummary').innerHTML = `
    <div class="summary-grid">
      <div class="summary-card"><div class="label">Portfolio Value</div><div class="value">${fmt$(totalValue)}</div></div>
      <div class="summary-card"><div class="label">Total Return</div><div class="value ${pc(totalReturn)}">${fmtPct(totalReturn)}</div></div>
      <div class="summary-card"><div class="label">Cash</div><div class="value">${fmt$(data.cash)}</div></div>
      <div class="summary-card"><div class="label">Invested</div><div class="value">${fmt$(posValue)}</div></div>
    </div>
    <div class="paper-stats">
      <div class="summary-card"><div class="label">Starting</div><div class="value" style="font-size:16px">${fmt$(data.startingCapital)}</div></div>
      <div class="summary-card"><div class="label">Realized P&L</div><div class="value ${pc(totalRealized)}" style="font-size:16px">${fmt$(totalRealized)}</div></div>
      <div class="summary-card"><div class="label">Days Active</div><div class="value" style="font-size:16px">${daysSinceStart}</div></div>
    </div>`;

  // Performance chart (SVG sparkline)
  if (data.history.length > 1) {
    const hist = data.history;
    const values = hist.map(h=>h.totalValue);
    const minV = Math.min(...values)*0.995, maxV = Math.max(...values)*1.005;
    const range = maxV-minV || 1;
    const w = 100, h = 180, pad = 30;
    const points = values.map((v,i)=>`${(i/(values.length-1)*100).toFixed(1)},${(h-pad-(v-minV)/range*(h-2*pad)).toFixed(1)}`).join(' ');
    const latest = values[values.length-1];
    const gradColor = latest >= data.startingCapital ? '#4caf50' : '#ef5350';
    document.getElementById('paperChart').innerHTML = `
      <div class="paper-chart">
        <div class="section-title" style="padding:0 0 8px">Portfolio History</div>
        <svg viewBox="0 0 100 ${h}" preserveAspectRatio="none">
          <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${gradColor}" stop-opacity="0.4"/><stop offset="100%" stop-color="${gradColor}" stop-opacity="0.05"/></linearGradient></defs>
          <polyline points="0,${(h-pad-(data.startingCapital-minV)/range*(h-2*pad)).toFixed(1)} 100,${(h-pad-(data.startingCapital-minV)/range*(h-2*pad)).toFixed(1)}" fill="none" stroke="#444" stroke-width="0.3" stroke-dasharray="2,2"/>
          <polygon points="0,${h-pad} ${points} 100,${h-pad}" fill="url(#pg)"/>
          <polyline points="${points}" fill="none" stroke="${gradColor}" stroke-width="1.2" stroke-linejoin="round"/>
          <text x="2" y="12" fill="#666" font-size="6">${fmt$(maxV)}</text>
          <text x="2" y="${h-pad+12}" fill="#666" font-size="6">${fmt$(minV)}</text>
          <text x="50" y="${(h-pad-(data.startingCapital-minV)/range*(h-2*pad)-3).toFixed(1)}" fill="#666" font-size="5" text-anchor="middle">Start: ${fmt$(data.startingCapital)}</text>
        </svg>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);padding:0 4px"><span>${hist[0].date}</span><span>${hist[hist.length-1].date}</span></div>
      </div>`;
  } else {
    document.getElementById('paperChart').innerHTML = '';
  }

  // Current positions
  document.getElementById('paperPositions').innerHTML = data.positions.length ? `
    <div class="section-title">Open Positions (${data.positions.length})</div>
    <div class="paper-pos">${data.positions.map(p=>{
      const val=p.shares*(p.currentPrice||p.avgCost);
      const pnl=(p.currentPrice-p.avgCost)*p.shares;
      const pnlPct=p.avgCost>0?((p.currentPrice-p.avgCost)/p.avgCost)*100:0;
      return `<div class="pos-row">
        <div><span class="pos-sym">${p.symbol}</span> <span class="pos-type ${p.type}">${p.type}</span>
          <div class="pos-detail">${p.shares.toFixed(2)} shares @ ${fmt$(p.avgCost)} | Since ${p.boughtAt}</div>
        </div>
        <div class="pos-val">
          <div class="price">${fmt$(val)}</div>
          <div class="${pc(pnl)}" style="font-size:11px">${fmt$(pnl)} (${fmtPct(pnlPct)})</div>
        </div>
      </div>`;
    }).join('')}</div>` : '<div class="section-title">No open positions</div>';

  // Recent trades
  const recentTrades = data.trades.slice(-20).reverse();
  document.getElementById('paperTrades').innerHTML = recentTrades.length ? `
    <div class="section-title">Recent Trades (${data.trades.length} total)</div>
    ${recentTrades.map(t=>`
      <div class="trade-row">
        <div class="trade-icon ${t.action.toLowerCase()}">${t.action==='BUY'?'B':'S'}</div>
        <div class="trade-info">
          <div class="sym">${t.action} ${t.symbol}</div>
          <div class="detail">${t.shares.toFixed(2)} shares @ ${fmt$(t.price)} | ${t.date}</div>
          <div class="detail">${t.reason}</div>
        </div>
        <div class="trade-val">
          <div class="amt">${fmt$(t.total)}</div>
          ${t.realizedPnL!=null?`<div class="pnl ${pc(t.realizedPnL)}">${fmt$(t.realizedPnL)}</div>`:''}
        </div>
      </div>`).join('')}` : '<div class="section-title">No trades yet</div>';
}

async function loadData() {
  try {
    const [pRes, dRes, ppRes] = await Promise.all([
      fetch('data/portfolio.json?t='+Date.now()),
      fetch('data/discovery.json?t='+Date.now()),
      fetch('data/paper-portfolio.json?t='+Date.now()).catch(()=>null),
    ]);
    const portfolio = await pRes.json();
    const discovery = await dRes.json();
    renderPortfolio(portfolio);
    renderDiscovery(discovery);
    renderGlossary();
    if (ppRes && ppRes.ok) {
      const paper = await ppRes.json();
      renderPaperTrading(paper);
    } else {
      renderPaperTrading(null);
    }
  } catch(e) {
    document.getElementById('stocksArea').innerHTML = '<div class="loading">No data yet. Run the stock alarm first.</div>';
    renderGlossary();
    renderPaperTrading(null);
  }
}

// Service worker
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
loadData();
</script>
</body>
</html>
