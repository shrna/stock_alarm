<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a237e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Stock Alarm</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0f1117;--card:#1a1d2e;--card2:#252840;--accent:#4fc3f7;--green:#4caf50;--red:#ef5350;--gold:#ffd740;--text:#e8eaed;--dim:#9aa0a6;--blue:#1a237e;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:80px}
.header{background:linear-gradient(135deg,#1a237e,#283593);padding:20px 16px 16px;padding-top:max(20px,env(safe-area-inset-top));position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:700;letter-spacing:.5px}
.header .date{font-size:12px;color:#90caf9;margin-top:2px}
.header-signin{background:#fff;color:#1a237e;border:none;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.header-signin:active{opacity:.8}
.header-signin img{width:14px;height:14px}
.header-user{display:flex;align-items:center;gap:8px}
.header-user img{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.3)}
.header-user .hu-name{font-size:11px;font-weight:600;color:#fff;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-user .hu-sync{font-size:9px;color:#69f0ae}
.header-user .hu-logout{background:rgba(255,255,255,.15);color:#fff;border:none;padding:4px 10px;border-radius:12px;font-size:10px;cursor:pointer}
.tabs{display:flex;background:var(--card);border-bottom:1px solid #333;position:sticky;top:0;z-index:99}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.tab.active{color:var(--accent);border-color:var(--accent)}
.tab-content{display:none}.tab-content.active{display:block}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.summary-card{background:var(--card);border-radius:var(--radius);padding:14px}
.summary-card .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.summary-card .value{font-size:20px;font-weight:700;margin-top:4px}
.summary-card.full{grid-column:1/-1}
.up{color:var(--green)}.down{color:var(--red)}
.stock-card{background:var(--card);border-radius:var(--radius);margin:8px 16px;overflow:hidden;transition:transform .2s}
.stock-card:active{transform:scale(.98)}
.stock-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer}
.stock-header .left h3{font-size:16px;font-weight:700}.stock-header .left .name{font-size:11px;color:var(--dim)}
.stock-header .right{text-align:right}
.stock-header .price{font-size:16px;font-weight:600}
.stock-header .change{font-size:12px;font-weight:600}
.signal-badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.5px}
.signal-STRONG-BUY{background:#1b5e20;color:#a5d6a7}.signal-BUY{background:#2e7d32;color:#c8e6c9}
.signal-HOLD{background:#f57f17;color:#fff9c4}.signal-SELL{background:#c62828;color:#ffcdd2}.signal-STRONG-SELL{background:#b71c1c;color:#ffcdd2}
.stock-detail{display:none;padding:0 16px 16px;animation:slideDown .2s ease}
.stock-detail.open{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--card2);border-radius:10px;padding:10px 12px}
.metric .label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
.metric .val{font-size:14px;font-weight:600;margin-top:2px}
.section-title{font-size:13px;font-weight:700;color:var(--accent);padding:14px 16px 6px;text-transform:uppercase;letter-spacing:.5px}
.analyst-bar{display:flex;height:24px;border-radius:6px;overflow:hidden;margin:8px 0}
.analyst-bar div{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.analyst-bar .sb{background:#1b5e20}.analyst-bar .b{background:#43a047}.analyst-bar .h{background:#f9a825}.analyst-bar .s{background:#e53935}.analyst-bar .ss{background:#b71c1c}
.zacks-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px}
.zacks-1{background:#1b5e20;color:#c8e6c9}.zacks-2{background:#2e7d32;color:#c8e6c9}.zacks-3{background:#f57f17;color:#fff9c4}.zacks-4{background:#c62828;color:#ffcdd2}.zacks-5{background:#b71c1c;color:#ffcdd2}
.news-item{padding:10px 0;border-bottom:1px solid #333}
.news-item:last-child{border:none}
.news-item a{color:var(--accent);text-decoration:none;font-size:13px;line-height:1.4}
.news-item .source{font-size:11px;color:var(--dim);margin-top:2px}
.reasons-list{list-style:none;padding:8px 0}
.reasons-list li{padding:4px 0;font-size:12px;color:var(--dim)}
.reasons-list li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px}
.reasons-list li.bullish::before{background:var(--green)}.reasons-list li.bearish::before{background:var(--red)}.reasons-list li.neutral::before{background:var(--gold)}
.discovery-card{background:var(--card);border-radius:var(--radius);margin:8px 16px;overflow:hidden}
.discovery-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer}
.discovery-header .sym{font-size:15px;font-weight:700}.discovery-header .nm{font-size:11px;color:var(--dim)}
.discovery-detail{display:none;padding:0 16px 16px}.discovery-detail.open{display:block}
.analysis-text{font-size:12px;line-height:1.6;color:var(--dim);padding:8px 0;border-bottom:1px solid #333;margin-bottom:8px}
.chart-container{background:var(--card);border-radius:var(--radius);margin:8px 16px;padding:16px}
.chart-container canvas{width:100%;height:200px}
.holdings-bar{display:flex;height:28px;border-radius:6px;overflow:hidden;margin:6px 0}
.holdings-bar div{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;padding:0 2px}
.holdings-legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.holdings-legend span{font-size:10px;color:var(--dim);display:flex;align-items:center;gap:4px}
.holdings-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sector-bars{margin:6px 0}
.sector-row{display:flex;align-items:center;margin:3px 0;font-size:11px}
.sector-row .lbl{width:110px;color:var(--dim);text-transform:capitalize;flex-shrink:0}
.sector-row .bar-bg{flex:1;height:14px;background:var(--card2);border-radius:4px;overflow:hidden}
.sector-row .bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;font-size:9px;font-weight:600;color:#fff;min-width:20px}
.returns-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.returns-grid .ret{background:var(--card2);border-radius:8px;padding:8px;text-align:center}
.returns-grid .ret .period{font-size:9px;color:var(--dim);text-transform:uppercase}
.returns-grid .ret .pct{font-size:14px;font-weight:700;margin-top:2px}
.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.risk-grid .rk{background:var(--card2);border-radius:8px;padding:8px;text-align:center}
.ext-ratings{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0}
.ext-rating-card{background:var(--card2);border-radius:10px;padding:12px;text-align:center;border:1px solid #333}
.ext-rating-card .er-source{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.ext-rating-card .er-rating{font-size:15px;font-weight:700;margin:4px 0}
.ext-rating-card .er-score{font-size:11px;color:var(--dim)}
.ext-rating-card .er-target{font-size:12px;color:var(--accent);margin-top:4px;font-weight:600}
.ext-rating-card .er-extras{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.ext-rating-card .er-extras span{font-size:9px;background:var(--bg);padding:2px 6px;border-radius:4px;color:var(--dim)}
.risk-grid .rk .rlbl{font-size:9px;color:var(--dim);text-transform:uppercase}
.risk-grid .rk .rval{font-size:14px;font-weight:700;margin-top:2px;color:var(--accent)}
.glossary-item{padding:12px 16px;border-bottom:1px solid #222}
.glossary-item dt{font-size:13px;font-weight:700;color:var(--accent)}
.glossary-item dd{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5}
.pull-refresh{text-align:center;padding:12px;font-size:12px;color:var(--dim)}
.loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:14px;color:var(--dim)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid #333;display:flex;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:100}
.nav-item{flex:1;padding:10px 8px 6px;text-align:center;font-size:10px;color:var(--dim);cursor:pointer}
.nav-item.active{color:var(--accent)}
.nav-item .icon{font-size:20px;margin-bottom:2px}
.earnings-tag{display:inline-block;background:#4a148c;color:#ce93d8;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin-top:4px}
.paper-chart{background:var(--card);border-radius:var(--radius);margin:8px 16px;padding:16px;position:relative}
.paper-chart canvas{width:100%;height:180px}
.paper-chart svg{width:100%;height:180px}
.trade-row{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid #222;gap:10px}
.trade-row .trade-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.trade-row .trade-icon.buy{background:#1b5e20;color:#a5d6a7}.trade-row .trade-icon.sell{background:#b71c1c;color:#ffcdd2}
.trade-row .trade-info{flex:1;min-width:0}
.trade-row .trade-info .sym{font-size:14px;font-weight:700}
.trade-row .trade-info .detail{font-size:11px;color:var(--dim)}
.trade-row .trade-val{text-align:right;flex-shrink:0}
.trade-row .trade-val .amt{font-size:14px;font-weight:600}
.trade-row .trade-val .pnl{font-size:11px}
.paper-pos{background:var(--card);border-radius:var(--radius);margin:8px 16px;padding:12px 16px}
.paper-pos .pos-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #222}
.paper-pos .pos-row:last-child{border:none}
.paper-pos .pos-sym{font-weight:700;font-size:14px}
.paper-pos .pos-type{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;text-transform:uppercase}
.paper-pos .pos-type.stock{background:#1a237e;color:#90caf9}.paper-pos .pos-type.etf{background:#4a148c;color:#ce93d8}
.paper-pos .pos-detail{font-size:11px;color:var(--dim)}
.paper-pos .pos-val{text-align:right}
.paper-pos .pos-val .price{font-size:13px;font-weight:600}
.paper-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 16px}
.home-hero{background:linear-gradient(135deg,#1a237e 0%,#283593 50%,#1a237e 100%);border-radius:var(--radius);margin:12px 16px;padding:20px;position:relative;overflow:hidden}
.home-hero::after{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;background:radial-gradient(circle,rgba(79,195,247,0.15),transparent 70%);border-radius:50%}
.home-hero .hero-title{font-size:11px;color:#90caf9;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.home-hero .hero-value{font-size:32px;font-weight:800;margin:4px 0}
.home-hero .hero-sub{font-size:13px;color:#90caf9}
.home-row{display:flex;gap:10px;padding:0 16px;margin-top:10px}
.home-minicard{flex:1;background:var(--card);border-radius:var(--radius);padding:14px;text-align:center}
.home-minicard .mc-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.home-minicard .mc-value{font-size:18px;font-weight:700;margin-top:4px}
.home-minicard .mc-sub{font-size:11px;margin-top:2px}
.earnings-cal{margin:8px 16px}
.earnings-cal .cal-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-radius:10px;margin-bottom:6px}
.earnings-cal .cal-date{min-width:50px;text-align:center}
.earnings-cal .cal-date .month{font-size:10px;color:var(--accent);text-transform:uppercase;font-weight:600}
.earnings-cal .cal-date .day{font-size:22px;font-weight:800;line-height:1.1}
.earnings-cal .cal-info{flex:1;min-width:0}
.earnings-cal .cal-info .cal-sym{font-size:14px;font-weight:700}
.earnings-cal .cal-info .cal-name{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.earnings-cal .cal-badge{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;flex-shrink:0}
.cal-badge.own{background:#1b5e20;color:#a5d6a7}.cal-badge.pick{background:#4a148c;color:#ce93d8}
.strongbuy-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #222}
.strongbuy-row:last-child{border:none}
.strongbuy-rank{width:28px;height:28px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent);flex-shrink:0}
.strongbuy-info{flex:1;min-width:0}
.strongbuy-info .sb-sym{font-size:14px;font-weight:700}
.strongbuy-info .sb-name{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strongbuy-right{text-align:right;flex-shrink:0}
.strongbuy-right .sb-price{font-size:14px;font-weight:600}
.strongbuy-right .sb-change{font-size:11px}
.home-section{background:var(--card);border-radius:var(--radius);margin:12px 16px;overflow:hidden}
.home-section-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.home-section-head .hs-title{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.home-section-head .hs-link{font-size:11px;color:var(--dim);cursor:pointer}
.portfolio-ticker{display:flex;overflow-x:auto;gap:10px;padding:8px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.portfolio-ticker::-webkit-scrollbar{display:none}
.ptick{background:var(--card);border-radius:10px;padding:10px 14px;min-width:110px;flex-shrink:0}
.ptick .pt-sym{font-size:13px;font-weight:700}
.ptick .pt-price{font-size:12px;margin-top:2px}
.ptick .pt-change{font-size:11px;font-weight:600}
.editor-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column;overflow:hidden}
.editor-overlay.open{display:flex}
.editor-bar{display:flex;justify-content:space-between;align-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));background:linear-gradient(135deg,#1a237e,#283593)}
.editor-bar button{background:none;border:none;color:var(--accent);font-size:15px;font-weight:700;cursor:pointer;padding:8px 12px}
.editor-bar .title{font-size:16px;font-weight:700;color:#fff}
.editor-tabs{display:flex;background:var(--card);border-bottom:1px solid #333}
.editor-tabs .etab{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent}
.editor-tabs .etab.active{color:var(--accent);border-color:var(--accent)}
.editor-body{flex:1;overflow-y:auto;padding-bottom:80px}
.stock-edit-row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #222;gap:10px}
.stock-edit-row input{background:var(--card2);border:1px solid #444;border-radius:8px;color:var(--text);padding:8px 10px;font-size:14px;width:100%}
.stock-edit-row input:focus{border-color:var(--accent);outline:none}
.stock-edit-row .field{flex:1}
.stock-edit-row .field label{font-size:9px;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:3px}
.stock-edit-row .del-btn{width:32px;height:32px;border-radius:8px;background:#b71c1c;border:none;color:#ffcdd2;font-size:16px;cursor:pointer;flex-shrink:0}
.add-stock-btn{margin:12px 16px;padding:12px;background:var(--card);border:2px dashed #444;border-radius:var(--radius);text-align:center;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
.add-stock-btn:active{background:var(--card2)}
.notes-area{margin:12px 16px}
.notes-area textarea{width:100%;min-height:150px;background:var(--card);border:1px solid #444;border-radius:var(--radius);color:var(--text);padding:12px;font-size:14px;font-family:monospace;resize:vertical;box-sizing:border-box}
.notes-area textarea:focus{border-color:var(--accent);outline:none}
.notes-area .hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
.notes-area .parse-btn{margin-top:10px;padding:12px;background:var(--accent);color:#000;border:none;border-radius:var(--radius);font-size:14px;font-weight:700;width:100%;cursor:pointer}
.notes-area .parse-btn:active{opacity:.8}
.sync-banner{margin:12px 16px;padding:14px;background:#1b5e20;border-radius:var(--radius);text-align:center}
.sync-banner a{color:#a5d6a7;font-weight:700;text-decoration:none;font-size:13px}
.edit-fab{position:fixed;bottom:80px;right:16px;width:50px;height:50px;border-radius:50%;background:var(--accent);color:#000;border:none;font-size:22px;font-weight:700;cursor:pointer;z-index:99;box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.edit-fab:active{transform:scale(.9)}
.auth-banner{background:linear-gradient(135deg,#283593,#1a237e);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.auth-banner .ab-text{font-size:12px;color:#90caf9}
.auth-banner .ab-btn{background:#fff;color:#1a237e;border:none;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.auth-banner .ab-btn:active{opacity:.8}
.auth-banner .ab-btn img{width:16px;height:16px}
.user-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid #222}
.user-bar img{width:28px;height:28px;border-radius:50%}
.user-bar .ub-name{flex:1;font-size:12px;font-weight:600}
.user-bar .ub-mode{font-size:10px;color:var(--dim)}
.user-bar .ub-logout{background:none;border:1px solid #444;color:var(--dim);padding:4px 10px;border-radius:6px;font-size:10px;cursor:pointer}

</style>
</head>
<body>

<div class="header">
  <div>
    <h1>STOCK ALARM</h1>
    <div class="date" id="reportDate">Loading...</div>
  </div>
  <div id="headerAuth"></div>
</div>
<div id="authBanner"></div>
<div id="userBar"></div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="switchPage('home')"><div class="icon">&#127968;</div>Home</div>
  <div class="nav-item" onclick="switchPage('portfolio')"><div class="icon">&#128188;</div>Portfolio</div>
  <div class="nav-item" onclick="switchPage('discover')"><div class="icon">&#128270;</div>Discover</div>
  <div class="nav-item" onclick="switchPage('paper')"><div class="icon">&#128200;</div>Paper</div>
  <div class="nav-item" onclick="switchPage('glossary')"><div class="icon">&#128218;</div>Glossary</div>
</div>

<div id="page-home" class="page active">
  <div id="homeHero"></div>
  <div id="homeCards"></div>
  <div id="homePortfolioTicker"></div>
  <div id="homeEarnings"></div>
  <div id="homeStrongBuys"></div>
  <div id="homePaperHighlights"></div>
</div>

<div id="page-portfolio" class="page" style="display:none">
  <div id="summaryArea"></div>
  <div class="section-title">Your Holdings</div>
  <div id="stocksArea"></div>
</div>

<div id="page-discover" class="page" style="display:none">
  <div class="tabs">
    <div class="tab active" onclick="switchDiscoverTab('stocks')">Stocks</div>
    <div class="tab" onclick="switchDiscoverTab('etfs')">ETFs</div>
  </div>

<script>
const fmt$ = n => n==null||n===0?'N/A':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = n => n==null?'N/A':(n>=0?'+':'')+n.toFixed(2)+'%';
const fmtCap = n => {if(!n)return'N/A';if(n>=1e12)return'$'+(n/1e12).toFixed(2)+'T';if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(0)+'M';return'$'+n.toLocaleString()};
const fmtCF = n => {if(!n)return'N/A';if(Math.abs(n)>=1e9)return'$'+(n/1e9).toFixed(1)+'B';if(Math.abs(n)>=1e6)return'$'+(n/1e6).toFixed(0)+'M';return'$'+n.toLocaleString()};
const pc = v => v>=0?'up':'down';

// --- Firebase + Multi-User ---
const STOCKS_KEY = 'stockalarm_mystocks';
let db = null, auth = null, currentUser = null;

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCsvj1X_5NxkUejMU25FNl6TjViFhuiJGk",
  authDomain: "stockalarm-39f9f.firebaseapp.com",
  projectId: "stockalarm-39f9f",
  storageBucket: "stockalarm-39f9f.firebasestorage.app",
  messagingSenderId: "510315867494",
  appId: "1:510315867494:web:010135891e6f7b5033aca7",
};

function initFirebase() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
    return true;
  } catch (e) { console.error('[Firebase] Init error:', e); return false; }
}

function signIn() {
  if (!auth) { alert('Firebase not available. Please try again later.'); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithRedirect(provider);
}

function signOut() {
  if (auth) auth.signOut();
  currentUser = null;
  renderAuthUI();
  loadData();
}

function renderAuthUI() {
  const headerAuth = document.getElementById('headerAuth');
  const authBanner = document.getElementById('authBanner');
  const userBar = document.getElementById('userBar');
  if (currentUser) {
    headerAuth.innerHTML = `
      <div class="header-user">
        <div style="text-align:right">
          <div class="hu-name">${currentUser.displayName || currentUser.email}</div>
          <div class="hu-sync">☁ Synced</div>
        </div>
        <img src="${currentUser.photoURL || ''}" alt="" onerror="this.style.display='none'">
        <button class="hu-logout" onclick="signOut()">Sign Out</button>
      </div>`;
    authBanner.innerHTML = '';
    userBar.innerHTML = '';
  } else {
    headerAuth.innerHTML = `
      <button class="header-signin" onclick="signIn()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">Sign In
      </button>`;
    authBanner.innerHTML = '';
    userBar.innerHTML = '';
  }
}

// --- Firestore Portfolio ---
async function loadUserStocks() {
  if (db && currentUser) {
    try {
      const doc = await db.collection('portfolios').doc(currentUser.uid).get();
      if (doc.exists) return doc.data().stocks || [];
    } catch (e) { console.error('[Firestore] Read error:', e); }
  }
  // Fallback to localStorage
  try {
    const saved = localStorage.getItem(STOCKS_KEY);
    if (saved) return JSON.parse(saved);
  } catch {}
  return null;
}

async function saveUserStocks(stocks) {
  localStorage.setItem(STOCKS_KEY, JSON.stringify(stocks));
  if (db && currentUser) {
    try {
      await db.collection('portfolios').doc(currentUser.uid).set({
        stocks,
        displayName: currentUser.displayName || '',
        email: currentUser.email || '',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }, { merge: true });
    } catch (e) { console.error('[Firestore] Write error:', e); }
  }
}

function getMyStocks() {
  try {
    const saved = localStorage.getItem(STOCKS_KEY);
    if (saved) return JSON.parse(saved);
  } catch {}
  return null;
}

function openEditor() {
  const overlay = document.getElementById('editorOverlay');
  overlay.classList.add('open');
  renderEditorList();
  renderEditorNotes();
}

function closeEditor() {
  document.getElementById('editorOverlay').classList.remove('open');
}

function switchEditorTab(tab, el) {
  document.querySelectorAll('.editor-tabs .etab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('editor-list').style.display = tab === 'list' ? 'block' : 'none';
  document.getElementById('editor-notes').style.display = tab === 'notes' ? 'block' : 'none';
}

function renderEditorList() {
  let stocks = getMyStocks();
  if (!stocks) {
    const serverStocks = window._portfolioData?.stocks?.filter(s => !s.error) || [];
    stocks = serverStocks.map(s => ({ ticker: s.ticker, avgPrice: s.avgCost, quantity: s.quantity }));
    if (stocks.length) localStorage.setItem(STOCKS_KEY, JSON.stringify(stocks));
  }

  const syncStatus = (db && currentUser)
    ? `<div class="sync-banner" style="background:#1b5e20"><div style="font-size:12px;color:#a5d6a7">&#10003; Cloud sync enabled — saves push to Firestore automatically</div></div>`
    : `<div class="sync-banner" style="background:#283593;cursor:pointer" onclick="signIn()">
         <div style="color:#90caf9;font-weight:700;font-size:13px">&#128279; Sign in to sync across devices</div>
         <div style="font-size:10px;color:#90caf9;margin-top:4px">Your portfolio is saved locally only</div>
       </div>`;

  document.getElementById('editor-list').innerHTML = stocks.map((s, i) => `
    <div class="stock-edit-row" data-idx="${i}">
      <div class="field"><label>Ticker</label><input type="text" value="${s.ticker}" data-field="ticker" placeholder="AAPL" autocapitalize="characters"></div>
      <div class="field"><label>Avg Price</label><input type="number" value="${s.avgPrice}" data-field="avgPrice" placeholder="150.00" step="0.01"></div>
      <div class="field"><label>Qty</label><input type="number" value="${s.quantity}" data-field="quantity" placeholder="10"></div>
      <button class="del-btn" onclick="deleteStock(${i})">&#10005;</button>
    </div>`).join('') +
    `<div class="add-stock-btn" onclick="addStock()">+ Add Stock</div>` + syncStatus;
}

function renderEditorNotes() {
  document.getElementById('editor-notes').innerHTML = `
    <div class="notes-area">
      <textarea id="notesInput" placeholder="Paste from iPhone Notes:&#10;&#10;PYPL 214.00 14&#10;SNDK 889.00 5&#10;BP 45.12 30&#10;&#10;Format: TICKER PRICE QUANTITY&#10;(one per line, space or comma separated)"></textarea>
      <div class="hint">Type your stocks in Notes app, copy, and paste here.<br>Format: <b>TICKER PRICE QUANTITY</b> — one per line.<br>Accepts spaces, commas, or tabs as separators.</div>
      <button class="parse-btn" onclick="parseNotes()">Import from Notes</button>
    </div>`;
}

function readEditorStocks() {
  const rows = document.querySelectorAll('#editor-list .stock-edit-row');
  const stocks = [];
  rows.forEach(row => {
    const ticker = row.querySelector('[data-field=ticker]').value.toUpperCase().trim();
    const avgPrice = parseFloat(row.querySelector('[data-field=avgPrice]').value) || 0;
    const quantity = parseInt(row.querySelector('[data-field=quantity]').value) || 0;
    if (ticker) stocks.push({ ticker, avgPrice, quantity });
  });
  return stocks;
}

function addStock() {
  const stocks = readEditorStocks();
  stocks.push({ ticker: '', avgPrice: 0, quantity: 0 });
  localStorage.setItem(STOCKS_KEY, JSON.stringify(stocks));
  renderEditorList();
  setTimeout(() => {
    const inputs = document.querySelectorAll('#editor-list .stock-edit-row:last-of-type input');
    if (inputs[0]) inputs[0].focus();
  }, 100);
}

function deleteStock(idx) {
  const stocks = readEditorStocks();
  stocks.splice(idx, 1);
  localStorage.setItem(STOCKS_KEY, JSON.stringify(stocks));
  renderEditorList();
}

function parseNotes() {
  const text = document.getElementById('notesInput').value.trim();
  if (!text) return;

  const lines = text.split('\n').filter(l => l.trim());
  const stocks = [];
  for (const line of lines) {
    const parts = line.trim().split(/[\s,\t]+/);
    if (parts.length >= 3) {
      const ticker = parts[0].toUpperCase().replace(/[^A-Z]/g, '');
      const avgPrice = parseFloat(parts[1]) || 0;
      const quantity = parseInt(parts[2]) || 0;
      if (ticker) stocks.push({ ticker, avgPrice, quantity });
    } else if (parts.length === 2) {
      const ticker = parts[0].toUpperCase().replace(/[^A-Z]/g, '');
      const quantity = parseInt(parts[1]) || 0;
      if (ticker) stocks.push({ ticker, avgPrice: 0, quantity });
    }
  }

  if (stocks.length) {
    localStorage.setItem(STOCKS_KEY, JSON.stringify(stocks));
    document.querySelectorAll('.editor-tabs .etab').forEach(t => t.classList.remove('active'));
    document.querySelector('.editor-tabs .etab:first-child').classList.add('active');
    document.getElementById('editor-list').style.display = 'block';
    document.getElementById('editor-notes').style.display = 'none';
    renderEditorList();
    alert(`Imported ${stocks.length} stocks!`);
  } else {
    alert('Could not parse any stocks. Use format: TICKER PRICE QTY');
  }
}

function setupGhToken() {
  const token = prompt('Paste your GitHub Personal Access Token:\n\n(Create one at github.com → Settings → Developer Settings → Fine-grained tokens → Contents read/write for shrna/stock_alarm)');
  if (token && token.trim()) {
    saveGhToken(token.trim());
    renderEditorList();

}

async function savePortfolio() {
  const stocks = readEditorStocks().filter(s => s.ticker);
  const saveBtn = document.querySelector('.editor-bar button:last-child');
  saveBtn.textContent = 'Saving...';
  saveBtn.disabled = true;

  await saveUserStocks(stocks);

  saveBtn.textContent = 'Save';
  saveBtn.disabled = false;
  closeEditor();
  loadData();
}

function analystBar(a) {
  const t = a.total||1;
  return `<div class="analyst-bar">
    ${a.strongBuy?`<div class="sb" style="width:${a.strongBuy/t*100}%">${a.strongBuy}</div>`:''}

    ${a.hold?`<div class="h" style="width:${a.hold/t*100}%">${a.hold}</div>`:''}
    ${a.sell?`<div class="s" style="width:${a.sell/t*100}%">${a.sell}</div>`:''}
    ${a.strongSell?`<div class="ss" style="width:${a.strongSell/t*100}%">${a.strongSell}</div>`:''}
  </div>`;
}

function ratingColor(label) {
  if (!label) return 'var(--dim)';
  const l = label.toLowerCase();
  if (l.includes('strong buy')) return '#00e676';
  if (l.includes('buy')) return '#69f0ae';
  if (l.includes('hold') || l.includes('moderate')) return '#ffd740';
  if (l.includes('sell')) return '#ff5252';
  return 'var(--dim)';
}

function renderExternalRatings(ratings) {
  if (!ratings || Object.keys(ratings).length === 0) return '';
  let html = '<div class="section-title" style="padding-left:0;margin-top:12px">Multi-Source Ratings</div>';
  html += '<div class="ext-ratings">';

  if (ratings.finviz) {
    const f = ratings.finviz;
    html += `<div class="ext-rating-card">
      <div class="er-source">Finviz</div>
      <div class="er-rating" style="color:${ratingColor(f.recommendationLabel)}">${f.recommendationLabel||'N/A'}</div>
      <div class="er-score">${f.recommendation?f.recommendation.toFixed(1)+'/5':''}</div>
      ${f.targetPrice?`<div class="er-target">Target: ${fmt$(f.targetPrice)}</div>`:''}
      <div class="er-extras">
        ${f.rsi?`<span>RSI: ${f.rsi}</span>`:''}
        ${f.sma20?`<span>SMA20: ${f.sma20}</span>`:''}
        ${f.sma50?`<span>SMA50: ${f.sma50}</span>`:''}
        ${f.shortFloat?`<span>Short: ${f.shortFloat}</span>`:''}
      </div>
    </div>`;
  }

  if (ratings.stockAnalysis) {
    const sa = ratings.stockAnalysis;
    html += `<div class="ext-rating-card">
      <div class="er-source">StockAnalysis</div>
      <div class="er-rating" style="color:${ratingColor(sa.consensus)}">${sa.consensus||'N/A'}</div>
      ${sa.analystCount?`<div class="er-score">${sa.analystCount} analysts</div>`:''}
      ${sa.targetPrice?`<div class="er-target">Target: ${fmt$(sa.targetPrice)}</div>`:''}
    </div>`;
  }

  if (ratings.marketBeat) {
    const mb = ratings.marketBeat;
    html += `<div class="ext-rating-card">
      <div class="er-source">MarketBeat</div>
      <div class="er-rating" style="color:${ratingColor(mb.consensus)}">${mb.consensus||'N/A'}</div>
      ${mb.analystCount?`<div class="er-score">${mb.analystCount} analysts</div>`:''}
      ${mb.targetPrice?`<div class="er-target">Target: ${fmt$(mb.targetPrice)}</div>`:''}
    </div>`;
  }

  html += '</div>';
  return html;
}

          <div class="metric"><div class="label">EBITDA</div><div class="val">${fmtCF(s.ebitda)}</div></div>
        </div>
        ${s.earningsDate?`<div class="earnings-tag">Earnings: ${new Date(s.earningsDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>`:''}
        ${s.strongBuy!=null?`<div class="section-title" style="padding-left:0">Analyst Ratings</div>${analystBar({strongBuy:s.strongBuy,buy:s.buy,hold:s.hold,sell:s.sell,strongSell:s.strongSell,total:(s.strongBuy||0)+(s.buy||0)+(s.hold||0)+(s.sell||0)+(s.strongSell||0)})}<div class="metrics-grid"><div class="metric"><div class="label">Target</div><div class="val">${fmt$(s.targetLow)} - ${fmt$(s.targetHigh)}</div></div><div class="metric"><div class="label">Mean Target</div><div class="val" style="color:var(--accent)">${fmt$(s.targetMean)}</div></div></div>`:''}
        ${s.zacks?`<div style="margin-top:10px"><span class="zacks-badge zacks-${s.zacks.rank}">Zacks #${s.zacks.rank} ${s.zacks.label}</span></div>`:''}
        ${renderExternalRatings(s.externalRatings)}
      </div>
    </div>`).join('')
    : '<div class="loading">No stock picks today</div>';

  // ETFs
  const hColors = ['#4fc3f7','#4caf50','#ffd740','#ff7043','#ab47bc','#26a69a','#ef5350','#78909c','#7e57c2','#ec407a'];

  document.getElementById('discover-etfs').innerHTML = data.etfs.length
    ? `<div class="section-title">${data.etfs.length} Top ETF Picks</div>` + data.etfs.map((e,i) => {
      // Holdings distribution bar
      const holdingsHtml = e.holdings?.length ? `
        <div class="section-title" style="padding-left:0">Holdings Distribution</div>
        <div class="holdings-bar">${e.holdings.map((h,j)=>`<div style="width:${(h.pct*100).toFixed(1)}%;background:${hColors[j%hColors.length]}" title="${h.name}: ${(h.pct*100).toFixed(1)}%">${h.pct>0.04?h.symbol:''}</div>`).join('')}</div>
        <div class="holdings-legend">${e.holdings.map((h,j)=>`<span><span class="dot" style="background:${hColors[j%hColors.length]}"></span>${h.symbol||h.name} ${(h.pct*100).toFixed(1)}%</span>`).join('')}</div>` : '';

      // Sector weightings
      const sectorHtml = e.sectorWeightings?.length ? `
        <div class="section-title" style="padding-left:0">Sector Allocation</div>
        <div class="sector-bars">${e.sectorWeightings.map(s=>`<div class="sector-row"><span class="lbl">${s.sector}</span><div class="bar-bg"><div class="bar-fill" style="width:${(s.pct*100).toFixed(0)}%;background:${s.pct>0.2?'var(--accent)':s.pct>0.1?'#4caf50':'#78909c'}">${(s.pct*100).toFixed(1)}%</div></div></div>`).join('')}</div>` : '';

      // Trailing returns
      const ret = e.returns||{};
      const hasReturns = ret.ytd!=null||ret.oneMonth!=null;
      const returnsHtml = hasReturns ? `
        <div class="section-title" style="padding-left:0">Trailing Returns</div>
        <div class="returns-grid">
          ${ret.oneMonth!=null?`<div class="ret"><div class="period">1 Month</div><div class="pct ${pc(ret.oneMonth)}">${fmtPct(ret.oneMonth*100)}</div></div>`:''}
          ${ret.threeMonth!=null?`<div class="ret"><div class="period">3 Month</div><div class="pct ${pc(ret.threeMonth)}">${fmtPct(ret.threeMonth*100)}</div></div>`:''}
          ${ret.ytd!=null?`<div class="ret"><div class="period">YTD</div><div class="pct ${pc(ret.ytd)}">${fmtPct(ret.ytd*100)}</div></div>`:''}
          ${ret.oneYear!=null?`<div class="ret"><div class="period">1 Year</div><div class="pct ${pc(ret.oneYear)}">${fmtPct(ret.oneYear*100)}</div></div>`:''}
          ${ret.threeYear!=null?`<div class="ret"><div class="period">3 Year</div><div class="pct ${pc(ret.threeYear)}">${fmtPct(ret.threeYear*100)}</div></div>`:''}
          ${ret.fiveYear!=null?`<div class="ret"><div class="period">5 Year</div><div class="pct ${pc(ret.fiveYear)}">${fmtPct(ret.fiveYear*100)}</div></div>`:''}
        </div>` : '';

      // Risk metrics
      const rk = e.risk||{};
      const hasRisk = rk.sharpe!=null||rk.alpha!=null;
      const riskHtml = hasRisk ? `
        <div class="section-title" style="padding-left:0">Risk Analysis (3Y)</div>
        <div class="risk-grid">
          ${rk.sharpe!=null?`<div class="rk"><div class="rlbl">Sharpe</div><div class="rval">${rk.sharpe.toFixed(2)}</div></div>`:''}
          ${rk.alpha!=null?`<div class="rk"><div class="rlbl">Alpha</div><div class="rval">${rk.alpha.toFixed(2)}</div></div>`:''}
          ${rk.beta!=null?`<div class="rk"><div class="rlbl">Beta</div><div class="rval">${rk.beta.toFixed(2)}</div></div>`:''}
          ${rk.stdDev!=null?`<div class="rk"><div class="rlbl">Std Dev</div><div class="rval">${rk.stdDev.toFixed(1)}%</div></div>`:''}
          ${rk.rSquared!=null?`<div class="rk"><div class="rlbl">R-Squared</div><div class="rval">${rk.rSquared.toFixed(1)}</div></div>`:''}
          ${rk.treynor!=null?`<div class="rk"><div class="rlbl">Treynor</div><div class="rval">${rk.treynor.toFixed(2)}</div></div>`:''}
        </div>` : '';

      // Zacks badge
      const zacksHtml = e.zacks ? `<div style="margin-top:10px"><span class="zacks-badge zacks-${e.zacks.rank}">Zacks #${e.zacks.rank} ${e.zacks.label}</span></div>` : '';

      return `
    <div class="discovery-card">
      <div class="discovery-header" onclick="toggleDetail('de${i}')">
        <div><span class="sym">${e.symbol}</span> <span class="nm">${e.name}</span>
          ${e.zacks?`<span class="signal-badge signal-${e.zacks.rank<=1?'STRONG-BUY':'BUY'}">${e.zacks.label}</span>`:''}</div>
        <div style="text-align:right"><div style="font-weight:700">${fmt$(e.price)}</div><div class="${pc(e.dayChangePct)}" style="font-size:12px">${fmtPct(e.dayChangePct)}</div></div>
      </div>
      <div class="discovery-detail" id="de${i}">
        <div class="analysis-text">${e.analysis||''}</div>
        <div class="metrics-grid">
          <div class="metric"><div class="label">Category</div><div class="val">${e.category||'N/A'}</div></div>
          <div class="metric"><div class="label">Fund Family</div><div class="val">${e.fundFamily||'N/A'}</div></div>
          <div class="metric"><div class="label">52wk Return</div><div class="val ${pc(e.fiftyTwoWeekChangePct)}">${fmtPct(e.fiftyTwoWeekChangePct)}</div></div>
          <div class="metric"><div class="label">Expense Ratio</div><div class="val">${e.expenseRatio?(e.expenseRatio*100).toFixed(2)+'%':'N/A'}</div></div>
          <div class="metric"><div class="label">Yield</div><div class="val">${e.yield?(e.yield*100).toFixed(2)+'%':'N/A'}</div></div>
          <div class="metric"><div class="label">AUM</div><div class="val">${fmtCap(e.totalAssets)}</div></div>
          <div class="metric"><div class="label">Beta</div><div class="val">${e.beta?e.beta.toFixed(2):'N/A'}</div></div>
          <div class="metric"><div class="label">Type</div><div class="val">${e.legalType||'ETF'}</div></div>
        </div>
        ${holdingsHtml}
        ${sectorHtml}
        ${returnsHtml}
        ${riskHtml}
        ${zacksHtml}
      </div>
    </div>`;}).join('')
    : '<div class="loading">No ETF picks today</div>';
}

function renderGlossary() {
  const terms = [
    ['P/E Ratio (Price-to-Earnings)','The stock price divided by earnings per share. Shows how much investors pay per dollar of earnings. Lower P/E may indicate undervaluation; higher P/E suggests growth expectations.'],
    ['Forward P/E','P/E ratio using estimated future earnings instead of trailing 12-month earnings. Useful for comparing current price against expected profitability.'],
    ['EPS (Earnings Per Share)','Company\'s net profit divided by outstanding shares. Higher EPS means more profit per share. Compare EPS growth quarter-over-quarter and year-over-year.'],
    ['PEG Ratio','P/E ratio divided by earnings growth rate. PEG < 1 suggests undervaluation relative to growth; PEG > 2 may indicate overvaluation.'],
    ['Market Cap','Total market value of a company\'s outstanding shares (price x shares). Large Cap: >$10B, Mid Cap: $2-10B, Small Cap: <$2B.'],
    ['Beta','Measures stock volatility relative to the market. Beta 1.0 = moves with market. Beta > 1 = more volatile. Beta < 1 = less volatile.'],
    ['P/B Ratio (Price-to-Book)','Stock price divided by book value per share. P/B < 1 may indicate undervaluation. Common for comparing financial sector stocks.'],
    ['Dividend Yield','Annual dividend payment divided by stock price, expressed as percentage. Higher yield = more income, but very high yields may signal risk.'],
    ['ROE (Return on Equity)','Net income divided by shareholder equity. Shows how efficiently a company uses equity to generate profits. Higher ROE (>15%) is generally better.'],
    ['Debt-to-Equity (D/E)','Total debt divided by shareholder equity. Higher D/E means more leverage/risk. Varies by industry — utilities often have high D/E; tech companies lower.'],
    ['Revenue Growth','Year-over-year percentage increase in total revenue. Consistent growth suggests a healthy, expanding business.'],
    ['Earnings Growth','Year-over-year percentage change in net earnings. Positive growth drives stock price appreciation.'],
    ['Profit Margin','Net income as a percentage of revenue. Shows how much of each dollar of revenue becomes profit. Higher margins = more efficient.'],
    ['Gross Margin','Revenue minus cost of goods sold, divided by revenue. Shows the markup on products/services before operating expenses.'],
    ['Operating Margin','Operating income divided by revenue. Shows profitability from core business operations, excluding taxes and interest.'],
    ['Free Cash Flow (FCF)','Cash generated after capital expenditures. Positive FCF means the company can fund dividends, buybacks, debt repayment, or growth.'],
    ['EBITDA','Earnings Before Interest, Taxes, Depreciation, and Amortization. Used to compare profitability across companies regardless of capital structure.'],
    ['50-Day Moving Average','Average closing price over the last 50 trading days. Price above 50-day MA is considered bullish; below is bearish.'],
    ['200-Day Moving Average','Average closing price over the last 200 trading days. A long-term trend indicator. Golden Cross (50d crosses above 200d) = bullish signal.'],
    ['52-Week Range','The lowest and highest prices a stock has traded at in the past year. Helps gauge where the current price sits relative to recent history.'],
    ['Analyst Target Price','The average stock price that Wall Street analysts predict. "Upside" is how much higher the target is vs. current price.'],
    ['Zacks Rank','Proprietary stock rating system by Zacks Investment Research. #1 Strong Buy to #5 Strong Sell. Based on earnings estimate revisions — historically, #1 stocks have outperformed.'],
    ['Expense Ratio (ETF)','Annual fee charged by an ETF, expressed as a percentage of assets. Lower is better. Index ETFs: 0.03-0.20%. Actively managed: 0.50-1.00%+.'],
    ['AUM (Assets Under Management)','Total market value of assets in an ETF. Higher AUM usually means better liquidity and tighter bid-ask spreads.'],
    ['Yield (ETF)','Annual dividend/interest income distributed by the ETF, as a percentage of its price.'],
    ['Sentiment Analysis','Automated analysis of news headlines to gauge market mood. Positive/Negative/Neutral based on keyword frequency in recent articles.'],
    ['Signal Score','Our composite score (0-100) combining Analyst Consensus (25%), Zacks Rank (20%), Price Target (20%), Moving Averages (15%), News Sentiment (10%), and P&L Position (10%).'],
    ['Sharpe Ratio','Risk-adjusted return metric. Calculated as (return - risk-free rate) / standard deviation. Higher is better. Above 1.0 = good, above 2.0 = excellent. Helps compare ETFs with different risk levels.'],
    ['Alpha','Excess return of an ETF relative to its benchmark. Positive alpha means outperformance. Alpha of 2.0 means the fund returned 2% more than expected given its risk.'],
    ['R-Squared','How closely an ETF tracks its benchmark index, from 0-100. R² of 95+ means the ETF closely mirrors the index. Lower R² = more independent movement.'],
    ['Standard Deviation','Measures the volatility of returns. Higher std dev = more price swings. A fund with 20% std dev has bigger ups and downs than one with 10%.'],
    ['Treynor Ratio','Risk-adjusted return per unit of systematic risk (beta). Similar to Sharpe but uses beta instead of total volatility. Higher is better.'],
    ['Sector Allocation','How an ETF distributes investments across economic sectors (Technology, Healthcare, etc.). Shows concentration risk — heavy weighting in one sector means more exposure to that sector\'s performance.'],
    ['Holdings Distribution','Percentage breakdown of the ETF\'s top individual stock holdings. Top-heavy ETFs (large % in few stocks) carry more concentration risk.'],
    ['Trailing Returns','Historical returns over various periods (1-month, YTD, 1-year, 3-year, 5-year). Past performance doesn\'t guarantee future results, but shows consistency.'],
    ['Fund Family','The investment company that manages the ETF (e.g., Vanguard, BlackRock/iShares, Invesco). Different families have different fee structures and investment philosophies.'],
  ];
  document.getElementById('glossaryArea').innerHTML = terms.map(([dt,dd])=>`<div class="glossary-item"><dt>${dt}</dt><dd>${dd}</dd></div>`).join('');
}

function renderPaperTrading(data) {
  if (!data || !data.history) {
    document.getElementById('paperSummary').innerHTML = '<div class="loading">Paper trading not started yet. Run the stock alarm first.</div>';
    return;
  }

  const totalValue = data.cash + data.positions.reduce((s,p)=>s+p.shares*(p.currentPrice||p.avgCost),0);
  const totalReturn = ((totalValue - data.startingCapital) / data.startingCapital) * 100;
  const posValue = data.positions.reduce((s,p)=>s+p.shares*(p.currentPrice||p.avgCost),0);

  // Stats
  const allSells = data.trades.filter(t=>t.action==='SELL'&&t.realizedPnL!=null);
  const totalRealized = allSells.reduce((s,t)=>s+(t.realizedPnL||0),0);
  const bestTrade = allSells.length ? allSells.reduce((a,b)=>(b.realizedPnL||0)>(a.realizedPnL||0)?b:a) : null;
  const worstTrade = allSells.length ? allSells.reduce((a,b)=>(b.realizedPnL||0)<(a.realizedPnL||0)?b:a) : null;
  const daysSinceStart = data.history.length || 1;

  document.getElementById('paperSummary').innerHTML = `
    <div class="summary-grid">
      <div class="summary-card"><div class="label">Portfolio Value</div><div class="value">${fmt$(totalValue)}</div></div>
      <div class="summary-card"><div class="label">Total Return</div><div class="value ${pc(totalReturn)}">${fmtPct(totalReturn)}</div></div>
      <div class="summary-card"><div class="label">Cash</div><div class="value">${fmt$(data.cash)}</div></div>
      <div class="summary-card"><div class="label">Invested</div><div class="value">${fmt$(posValue)}</div></div>
    </div>
    <div class="paper-stats">
      <div class="summary-card"><div class="label">Starting</div><div class="value" style="font-size:16px">${fmt$(data.startingCapital)}</div></div>
      <div class="summary-card"><div class="label">Realized P&L</div><div class="value ${pc(totalRealized)}" style="font-size:16px">${fmt$(totalRealized)}</div></div>
      <div class="summary-card"><div class="label">Days Active</div><div class="value" style="font-size:16px">${daysSinceStart}</div></div>
    </div>`;

  // Performance chart (SVG sparkline)
  if (data.history.length > 1) {
    const hist = data.history;
    const values = hist.map(h=>h.totalValue);
    const minV = Math.min(...values)*0.995, maxV = Math.max(...values)*1.005;
    const range = maxV-minV || 1;
    const w = 100, h = 180, pad = 30;
    const points = values.map((v,i)=>`${(i/(values.length-1)*100).toFixed(1)},${(h-pad-(v-minV)/range*(h-2*pad)).toFixed(1)}`).join(' ');
    const latest = values[values.length-1];
    const gradColor = latest >= data.startingCapital ? '#4caf50' : '#ef5350';
    document.getElementById('paperChart').innerHTML = `
      <div class="paper-chart">
        <div class="section-title" style="padding:0 0 8px">Portfolio History</div>
        <svg viewBox="0 0 100 ${h}" preserveAspectRatio="none">
          <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${gradColor}" stop-opacity="0.4"/><stop offset="100%" stop-color="${gradColor}" stop-opacity="0.05"/></linearGradient></defs>
          <polyline points="0,${(h-pad-(data.startingCapital-minV)/range*(h-2*pad)).toFixed(1)} 100,${(h-pad-(data.startingCapital-minV)/range*(h-2*pad)).toFixed(1)}" fill="none" stroke="#444" stroke-width="0.3" stroke-dasharray="2,2"/>
          <polygon points="0,${h-pad} ${points} 100,${h-pad}" fill="url(#pg)"/>
          <polyline points="${points}" fill="none" stroke="${gradColor}" stroke-width="1.2" stroke-linejoin="round"/>
          <text x="2" y="12" fill="#666" font-size="6">${fmt$(maxV)}</text>
          <text x="2" y="${h-pad+12}" fill="#666" font-size="6">${fmt$(minV)}</text>
          <text x="50" y="${(h-pad-(data.startingCapital-minV)/range*(h-2*pad)-3).toFixed(1)}" fill="#666" font-size="5" text-anchor="middle">Start: ${fmt$(data.startingCapital)}</text>
        </svg>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);padding:0 4px"><span>${hist[0].date}</span><span>${hist[hist.length-1].date}</span></div>
      </div>`;
  } else {
    document.getElementById('paperChart').innerHTML = '';
  }

  // Current positions
  document.getElementById('paperPositions').innerHTML = data.positions.length ? `
    <div class="section-title">Open Positions (${data.positions.length})</div>
    <div class="paper-pos">${data.positions.map(p=>{
      const val=p.shares*(p.currentPrice||p.avgCost);
      const pnl=(p.currentPrice-p.avgCost)*p.shares;
      const pnlPct=p.avgCost>0?((p.currentPrice-p.avgCost)/p.avgCost)*100:0;
      return `<div class="pos-row">
        <div><span class="pos-sym">${p.symbol}</span> <span class="pos-type ${p.type}">${p.type}</span>
          <div class="pos-detail">${p.shares.toFixed(2)} shares @ ${fmt$(p.avgCost)} | Since ${p.boughtAt}</div>
        </div>
        <div class="pos-val">
          <div class="price">${fmt$(val)}</div>
          <div class="${pc(pnl)}" style="font-size:11px">${fmt$(pnl)} (${fmtPct(pnlPct)})</div>
        </div>
      </div>`;
    }).join('')}</div>` : '<div class="section-title">No open positions</div>';

  // Recent trades
  const recentTrades = data.trades.slice(-20).reverse();
  document.getElementById('paperTrades').innerHTML = recentTrades.length ? `
    <div class="section-title">Recent Trades (${data.trades.length} total)</div>
    ${recentTrades.map(t=>`
      <div class="trade-row">
        <div class="trade-icon ${t.action.toLowerCase()}">${t.action==='BUY'?'B':'S'}</div>
        <div class="trade-info">
          <div class="sym">${t.action} ${t.symbol}</div>
          <div class="detail">${t.shares.toFixed(2)} shares @ ${fmt$(t.price)} | ${t.date}</div>
          <div class="detail">${t.reason}</div>
        </div>
        <div class="trade-val">
          <div class="amt">${fmt$(t.total)}</div>
          ${t.realizedPnL!=null?`<div class="pnl ${pc(t.realizedPnL)}">${fmt$(t.realizedPnL)}</div>`:''}
        </div>
      </div>`).join('')}` : '<div class="section-title">No trades yet</div>';
}

function renderHome(portfolio, discovery, paper) {
  // --- Hero: Combined net worth ---
  const pVal = portfolio?.totalCurrentValue || 0;
  const pInvested = portfolio?.totalInvested || 0;
  const pPnL = pVal - pInvested;
  const pPnLPct = pInvested > 0 ? (pPnL / pInvested) * 100 : 0;
  const paperVal = paper ? paper.cash + paper.positions.reduce((s,p) => s + p.shares * (p.currentPrice || p.avgCost), 0) : 0;
  const paperReturn = paper ? ((paperVal - paper.startingCapital) / paper.startingCapital) * 100 : 0;
  const combinedVal = pVal + paperVal;

  document.getElementById('homeHero').innerHTML = `
    <div class="home-hero">
      <div class="hero-title">Combined Net Worth</div>
      <div class="hero-value">${fmt$(combinedVal)}</div>
      <div class="hero-sub">Real: ${fmt$(pVal)} &bull; Paper: ${fmt$(paperVal)}</div>
    </div>`;

  // --- Mini cards ---
  const dayChange = portfolio?.stocks?.filter(s=>!s.error).reduce((s,st) => s + (st.dayChangePct || 0) * st.value, 0) / (pVal || 1);
  document.getElementById('homeCards').innerHTML = `
    <div class="home-row">
      <div class="home-minicard">
        <div class="mc-label">Portfolio P&L</div>
        <div class="mc-value ${pc(pPnL)}">${fmt$(pPnL)}</div>
        <div class="mc-sub ${pc(pPnLPct)}">${fmtPct(pPnLPct)}</div>
      </div>
      <div class="home-minicard">
        <div class="mc-label">Paper P&L</div>
        <div class="mc-value ${pc(paperReturn)}">${fmt$(paperVal - (paper?.startingCapital||10000))}</div>
        <div class="mc-sub ${pc(paperReturn)}">${fmtPct(paperReturn)}</div>
      </div>
      <div class="home-minicard">
        <div class="mc-label">Today</div>
        <div class="mc-value ${pc(dayChange)}">${fmtPct(dayChange)}</div>
        <div class="mc-sub">${portfolio?.stocks?.filter(s=>!s.error).length||0} holdings</div>
      </div>
    </div>`;

  // --- Portfolio ticker strip ---
  const stocks = portfolio?.stocks?.filter(s => !s.error) || [];
  document.getElementById('homePortfolioTicker').innerHTML = stocks.length ? `
    <div class="home-section-head" style="padding:14px 16px 4px"><span class="hs-title">Your Holdings</span><span class="hs-link" onclick="document.querySelector('.nav-item:nth-child(2)').click()">See All</span></div>
    <div class="portfolio-ticker">${stocks.map(s => `
      <div class="ptick">
        <div class="pt-sym">${s.ticker}</div>
        <div class="pt-price">${fmt$(s.price)}</div>
        <div class="pt-change ${pc(s.dayChangePct)}">${fmtPct(s.dayChangePct)}</div>
      </div>`).join('')}
    </div>` : '';

  // --- Earnings Calendar ---
  const earningsEvents = [];
  // From portfolio
  stocks.forEach(s => {
    if (s.earningsDate) earningsEvents.push({ symbol: s.ticker, name: s.name, date: s.earningsDate, type: 'own' });
  });
  // From discovery
  (discovery?.stocks || []).forEach(s => {
    if (s.earningsDate) earningsEvents.push({ symbol: s.symbol, name: s.name, date: s.earningsDate, type: 'pick' });
  });
  // Deduplicate by symbol, sort by date, only future
  const now = new Date();
  const seen = new Set();
  const upcoming = earningsEvents
    .filter(e => { if (seen.has(e.symbol)) return false; seen.add(e.symbol); return new Date(e.date) >= new Date(now.toISOString().split('T')[0]); })
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .slice(0, 10);

  document.getElementById('homeEarnings').innerHTML = upcoming.length ? `
    <div class="home-section">
      <div class="home-section-head"><span class="hs-title">Upcoming Earnings</span><span class="hs-link">${upcoming.length} events</span></div>
      <div class="earnings-cal">${upcoming.map(e => {
        const d = new Date(e.date);
        const month = d.toLocaleDateString('en-US', { month: 'short' });
        const day = d.getDate();
        const daysAway = Math.ceil((d - now) / 86400000);
        return `<div class="cal-row">
          <div class="cal-date"><div class="month">${month}</div><div class="day">${day}</div></div>
          <div class="cal-info"><div class="cal-sym">${e.symbol}</div><div class="cal-name">${e.name}</div></div>
          <div><span class="cal-badge ${e.type}">${e.type === 'own' ? 'Owned' : 'Pick'}</span></div>
          <div style="font-size:11px;color:var(--dim);min-width:45px;text-align:right">${daysAway === 0 ? 'Today' : daysAway === 1 ? 'Tomorrow' : daysAway + 'd'}</div>
        </div>`;
      }).join('')}</div>
    </div>` : '';

  // --- Top 10 Strong Buys ---
  const topBuys = (discovery?.stocks || []).slice(0, 10);
  document.getElementById('homeStrongBuys').innerHTML = topBuys.length ? `
    <div class="home-section">
      <div class="home-section-head"><span class="hs-title">Top 10 Strong Buys</span><span class="hs-link" onclick="document.querySelector('.nav-item:nth-child(3)').click()">See All</span></div>
      ${topBuys.map((s, i) => `
        <div class="strongbuy-row">
          <div class="strongbuy-rank">${i + 1}</div>
          <div class="strongbuy-info">
            <div class="sb-sym">${s.symbol} ${s.zacks ? `<span class="zacks-badge zacks-${s.zacks.rank}" style="font-size:9px;padding:2px 6px">Z#${s.zacks.rank}</span>` : ''}</div>
            <div class="sb-name">${s.name || ''} &bull; ${s.sector || ''}</div>
          </div>
          <div class="strongbuy-right">
            <div class="sb-price">${fmt$(s.price)}</div>
            <div class="sb-change ${pc(s.dayChangePct)}">${fmtPct(s.dayChangePct)}</div>
          </div>
        </div>`).join('')}
    </div>` : '';

  // --- Paper Trading Highlights ---
  if (paper && paper.positions.length) {
    const allSells = paper.trades.filter(t => t.action === 'SELL' && t.realizedPnL != null);
    const totalRealized = allSells.reduce((s, t) => s + (t.realizedPnL || 0), 0);
    const recentTrades = paper.trades.slice(-3).reverse();

    // Top performer
    const posWithPnl = paper.positions.map(p => {
      const val = p.shares * (p.currentPrice || p.avgCost);
      const pnl = (p.currentPrice - p.avgCost) * p.shares;
      const pnlPct = p.avgCost > 0 ? ((p.currentPrice - p.avgCost) / p.avgCost) * 100 : 0;
      return { ...p, val, pnl, pnlPct };
    }).sort((a, b) => b.pnlPct - a.pnlPct);

    document.getElementById('homePaperHighlights').innerHTML = `
      <div class="home-section">
        <div class="home-section-head"><span class="hs-title">Paper Trading (Global)</span><span class="hs-link" onclick="document.querySelector('.nav-item:nth-child(4)').click()">Full View</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 16px 8px">
          <div class="home-minicard"><div class="mc-label">Value</div><div class="mc-value" style="font-size:16px">${fmt$(paperVal)}</div></div>
          <div class="home-minicard"><div class="mc-label">Realized</div><div class="mc-value ${pc(totalRealized)}" style="font-size:16px">${fmt$(totalRealized)}</div></div>
          <div class="home-minicard"><div class="mc-label">Positions</div><div class="mc-value" style="font-size:16px">${paper.positions.length}</div></div>
        </div>
        ${posWithPnl.length ? `<div style="padding:0 16px 4px;font-size:11px;color:var(--dim)">Top performer: <span style="font-weight:700;color:var(--text)">${posWithPnl[0].symbol}</span> <span class="${pc(posWithPnl[0].pnlPct)}">${fmtPct(posWithPnl[0].pnlPct)}</span></div>` : ''}
        ${recentTrades.length ? `<div style="padding:4px 16px 12px;font-size:11px;color:var(--dim)">Latest: ${recentTrades.map(t => `<span style="color:${t.action==='BUY'?'var(--green)':'var(--red)'};font-weight:600">${t.action} ${t.symbol}</span>`).join(' &bull; ')}</div>` : ''}
      </div>`;
  } else {
    document.getElementById('homePaperHighlights').innerHTML = '';
  }
}

async function loadData() {
  try {
    const [pRes, dRes, ppRes] = await Promise.all([
      fetch('data/portfolio.json?t='+Date.now()),
      fetch('data/discovery.json?t='+Date.now()),
      fetch('data/paper-portfolio.json?t='+Date.now()).catch(()=>null),
    ]);
    const portfolio = await pRes.json();
    const discovery = await dRes.json();
    const paper = (ppRes && ppRes.ok) ? await ppRes.json() : null;

    // If user is signed in, overlay their Firestore/local portfolio onto the shared data
    const userStocks = await loadUserStocks();
    let userPortfolio = portfolio;
    if (userStocks && userStocks.length > 0) {
      // Build a price lookup from discovery + pipeline portfolio data
      const priceLookup = {};
      (portfolio?.stocks || []).forEach(s => { if (!s.error) priceLookup[s.ticker] = s; });
      (discovery?.stocks || []).forEach(s => { priceLookup[s.symbol] = { price: s.price, dayChangePct: s.dayChangePct, name: s.name, earningsDate: s.earningsDate }; });

      let totalInvested = 0, totalCurrentValue = 0;
      const enrichedStocks = userStocks.map(us => {
        const live = priceLookup[us.ticker];
        const price = live?.price || live?.currentPrice || 0;
        const value = price * us.quantity;
        const invested = us.avgPrice * us.quantity;
        totalInvested += invested;
        totalCurrentValue += value;
        return {
          ticker: us.ticker,
          name: live?.name || live?.shortName || us.ticker,
          price,
          dayChangePct: live?.dayChangePct || 0,
          avgCost: us.avgPrice,
          quantity: us.quantity,
          value,
          pnl: value - invested,
          pnlPct: invested > 0 ? ((value - invested) / invested) * 100 : 0,
          fiftyTwoWeekHigh: live?.fiftyTwoWeekHigh || 0,
          fiftyTwoWeekLow: live?.fiftyTwoWeekLow || 0,
          fiftyTwoWeekChangePct: live?.fiftyTwoWeekChangePct || 0,
          fiftyDayAvg: live?.fiftyDayAvg || 0,
          twoHundredDayAvg: live?.twoHundredDayAvg || 0,
          marketCap: live?.marketCap || 0,
          pe: live?.pe || 0,
          forwardPE: live?.forwardPE || 0,
          signal: live?.signal || 'N/A',
          signalScore: live?.signalScore || 0,
          reasons: live?.reasons || [],
          zacks: live?.zacks || null,
          sentiment: live?.sentiment || 'N/A',
          earningsDate: live?.earningsDate || null,
          news: live?.news || [],
          analysts: live?.analysts || {},
        };
      });

      userPortfolio = {
        ...portfolio,
        dateStr: portfolio?.dateStr || new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
        totalInvested,
        totalCurrentValue,
        totalPnL: totalCurrentValue - totalInvested,
        totalPnLPct: totalInvested > 0 ? ((totalCurrentValue - totalInvested) / totalInvested) * 100 : 0,
        stocks: enrichedStocks,
      };
    }

    window._portfolioData = userPortfolio;
    renderHome(userPortfolio, discovery, paper);
    renderPortfolio(userPortfolio);
    renderDiscovery(discovery);
    renderGlossary();
    renderPaperTrading(paper);
  } catch(e) {
    console.error('[Load] Error:', e);
    document.getElementById('stocksArea').innerHTML = '<div class="loading">No data yet. Run the stock alarm first.</div>';
    renderHome(null, null, null);
    renderGlossary();
    renderPaperTrading(null);
  }
}

// --- App Init ---
const firebaseReady = initFirebase();
if (firebaseReady && auth) {
  auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    renderAuthUI();

    // If signing in for first time, migrate localStorage data to Firestore
    if (user && db) {
      const localStocks = getMyStocks();
      const doc = await db.collection('portfolios').doc(user.uid).get().catch(() => null);
      if (localStocks && localStocks.length > 0 && (!doc || !doc.exists)) {
        await saveUserStocks(localStocks);
        console.log('[Firebase] Migrated local portfolio to cloud');
      } else if (doc && doc.exists) {
        // Load cloud data into localStorage for offline access
        const cloudStocks = doc.data().stocks || [];
        localStorage.setItem(STOCKS_KEY, JSON.stringify(cloudStocks));
      }
    }
    loadData();
  });
} else {
  renderAuthUI();
  loadData();
}

// Service worker
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
