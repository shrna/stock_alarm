name: Daily Stock Report

on:
  schedule:
    # Runs at 12:30 AM Pacific (7:30 AM UTC) every day
    - cron: '30 7 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pages: write

jobs:
  stock-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stock Alarm
        env:
          EXCEL_PASSWORD: ${{ secrets.EXCEL_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          SMS_GATEWAY: ${{ secrets.SMS_GATEWAY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: node index.js

      - name: Commit and push PWA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "Update stock data $(date +%Y-%m-%d)"
          git push

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
